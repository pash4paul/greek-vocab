topic: Внешность и характер
lesson: "24"

words:
  - el: μαλλί
    article: το
    ru: волос
    pos: noun
    note: волосы — τα μαλλιά, почти всегда во множественном числе
    example: Έχει μακριά καστανά μαλλιά.
    exampleRu: У неё длинные каштановые волосы.

  - el: γένι
    article: το
    ru: волосок бороды
    pos: noun
    note: борода — τα γένια, во множественном числе
    example: Ο παππούς μου έχει άσπρα γένια.
    exampleRu: У моего дедушки седая борода.

  - el: μουστάκι
    article: το
    ru: ус
    pos: noun
    note: усы — τα μουστάκια
    example: Ο θείος μου έχει μεγάλο μουστάκι.
    exampleRu: У моего дяди большие усы.

  - el: μάτι
    article: το
    ru: глаз
    pos: noun
    example: Έχει μαύρα μάτια.
    exampleRu: У него чёрные глаза.

  - el: ύψος
    article: το
    ru: рост, высота
    pos: noun
    example: Τι ύψος έχεις;
    exampleRu: Какой у тебя рост?

  - el: μέτρο
    article: το
    ru: метр, мера
    pos: noun
    example: Έχω ύψος ένα μέτρο και εβδομήντα.
    exampleRu: У меня рост метр семьдесят.

  - el: εκατοστό
    article: το
    ru: сантиметр
    pos: noun
    example: Ο αδελφός μου είναι δέκα εκατοστά πιο ψηλός.
    exampleRu: Мой брат на десять сантиметров выше.

  - el: περιγραφή
    article: η
    ru: описание
    pos: noun
    example: Κάνε μου μια περιγραφή του φίλου σου.
    exampleRu: Опиши мне своего друга.

  - el: περιγράφω
    ru: описывать
    pos: verb
    example: Περιγράφω το σπίτι μου στη δασκάλα.
    exampleRu: Я описываю свой дом учительнице.

  - el: καστανός
    ru: каштановый
    pos: adj
    example: Έχει καστανά μάτια.
    exampleRu: У неё каштановые глаза.

  - el: ξανθός
    ru: белокурый, светлый (о волосах)
    pos: adj
    note: женский род бывает и ξανθή, и ξανθιά
    example: Το κορίτσι είναι ξανθό.
    exampleRu: Девочка светловолосая.

  - el: μελαχρινός
    ru: темноволосый, смуглый
    pos: adj
    example: Ο άντρας της είναι μελαχρινός.
    exampleRu: Её муж темноволосый.

  - el: σγουρός
    ru: кудрявый
    pos: adj
    example: Έχει σγουρά μαλλιά.
    exampleRu: У него кудрявые волосы.

  - el: ίσιος
    ru: прямой, ровный
    pos: adj
    example: Τα μαλλιά της είναι ίσια.
    exampleRu: У неё прямые волосы.

  - el: μακρύς
    ru: длинный
    pos: adj
    example: Φοράει ένα μακρύ παλτό.
    exampleRu: Он носит длинное пальто.

  - el: κοντός
    ru: короткий, низкий (о росте)
    pos: adj
    example: Είμαι πιο κοντός από τον αδελφό μου.
    exampleRu: Я ниже своего брата.

  - el: μεσαίος
    ru: средний
    pos: adj
    example: Είναι μεσαίου ύψους.
    exampleRu: Он среднего роста.

  - el: αδύνατος
    ru: худой
    pos: adj
    example: Η αδελφή μου είναι πολύ αδύνατη.
    exampleRu: Моя сестра очень худая.

  - el: λεπτός
    ru: стройный, тонкий
    pos: adj
    example: Έχει λεπτό πρόσωπο.
    exampleRu: У неё тонкое лицо.

  - el: χοντρός
    ru: толстый
    pos: adj
    example: Το βιβλίο είναι πολύ χοντρό.
    exampleRu: Книга очень толстая.

  - el: άσχημος
    ru: некрасивый
    pos: adj
    example: Δεν είναι άσχημη, είναι πολύ όμορφη.
    exampleRu: Она не некрасивая, она очень красивая.

  - el: γελαστός
    ru: улыбчивый
    pos: adj
    example: Είναι πάντα γελαστός.
    exampleRu: Он всегда улыбчивый.

  - el: έξυπνος
    ru: умный
    pos: adj
    example: Το παιδί είναι πολύ έξυπνο.
    exampleRu: Ребёнок очень умный.

  - el: σοβαρός
    ru: серьёзный
    pos: adj
    example: Ο διευθυντής είναι σοβαρός άνθρωπος.
    exampleRu: Начальник — серьёзный человек.

  - el: συμπαθητικός
    ru: симпатичный
    pos: adj
    example: Η γιαγιά σου είναι πολύ συμπαθητική.
    exampleRu: Твоя бабушка очень милая.

  - el: χαρούμενος
    ru: радостный
    pos: adj
    example: Είμαι χαρούμενος σήμερα.
    exampleRu: Я сегодня радостный.
