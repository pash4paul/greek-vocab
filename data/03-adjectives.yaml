topic: Прилагательные
lesson: "04"

words:
  - el: μεγάλος
    ru: большой
    pos: adj
    forms:
      gender: [μεγάλος, μεγάλη, μεγάλο]
    example: Το σπίτι είναι μεγάλο.
    exampleRu: Дом большой.

  - el: μικρός
    ru: маленький
    pos: adj
    forms:
      gender: [μικρός, μικρή, μικρό]
    example: Έχω ένα μικρό αυτοκίνητο.
    exampleRu: У меня маленькая машина.

  - el: καλός
    ru: хороший
    pos: adj
    forms:
      gender: [καλός, καλή, καλό]
    example: Είναι πολύ καλός άνθρωπος.
    exampleRu: Он очень хороший человек.

  - el: κακός
    ru: плохой
    pos: adj
    forms:
      gender: [κακός, κακή, κακό]
    example: Ο καιρός είναι κακός σήμερα.
    exampleRu: Погода сегодня плохая.

  - el: ωραίος
    ru: красивый, приятный
    pos: adj
    forms:
      gender: [ωραίος, ωραία, ωραίο]
    example: Τι ωραία μέρα!
    exampleRu: Какой прекрасный день!

  - el: καινούργιος
    ru: новый
    pos: adj
    forms:
      gender: [καινούργιος, καινούργια, καινούργιο]
    example: Αυτό είναι το καινούργιο μου τηλέφωνο.
    exampleRu: Это мой новый телефон.

  - el: παλιός
    ru: старый
    pos: adj
    forms:
      gender: [παλιός, παλιά, παλιό]
    note: о вещах; о человеке «старый» — μεγάλος (в возрасте)
    example: Αυτό το σπίτι είναι πολύ παλιό.
    exampleRu: Этот дом очень старый.

  - el: ακριβός
    ru: дорогой
    pos: adj
    forms:
      gender: [ακριβός, ακριβή, ακριβό]
    example: Ο καφές εδώ είναι ακριβός.
    exampleRu: Кофе здесь дорогой.

  - el: φθηνός
    ru: дешёвый
    pos: adj
    note: в разговорной речи чаще пишут φτηνός — то же слово
    forms:
      gender: [φθηνός, φθηνή, φθηνό]
    example: Το κρασί εδώ είναι φθηνό.
    exampleRu: Вино здесь дешёвое.

  - el: εύκολος
    ru: лёгкий, простой
    pos: adj
    forms:
      gender: [εύκολος, εύκολη, εύκολο]
    example: Τα ελληνικά δεν είναι εύκολα.
    exampleRu: Греческий непростой.

  - el: δύσκολος
    ru: трудный, сложный
    pos: adj
    forms:
      gender: [δύσκολος, δύσκολη, δύσκολο]
    example: Τα ελληνικά είναι δύσκολα αλλά ωραία.
    exampleRu: Греческий трудный, но красивый.

  - el: ανοιχτός
    ru: открытый
    pos: adj
    forms:
      gender: [ανοιχτός, ανοιχτή, ανοιχτό]
    note: также «светлый» о цвете
    example: Το μαγαζί είναι ανοιχτό μέχρι τις οκτώ.
    exampleRu: Магазин открыт до восьми.

  - el: κλειστός
    ru: закрытый
    pos: adj
    forms:
      gender: [κλειστός, κλειστή, κλειστό]
    example: Το μαγαζί είναι κλειστό σήμερα.
    exampleRu: Магазин сегодня закрыт.
