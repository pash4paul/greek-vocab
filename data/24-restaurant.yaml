topic: Ресторан и таверна
lesson: "25"

words:
  - el: σερβιτόρος
    article: ο
    ru: официант
    pos: noun
    example: Ο σερβιτόρος φέρνει τον κατάλογο.
    exampleRu: Официант приносит меню.

  - el: σερβιτόρα
    article: η
    ru: официантка
    pos: noun
    example: Η σερβιτόρα είναι πολύ ευγενική.
    exampleRu: Официантка очень вежливая.

  - el: κατάλογος
    article: ο
    ru: меню, список блюд
    pos: noun
    example: Μπορώ να έχω τον κατάλογο;
    exampleRu: Можно мне меню?

  - el: τιμοκατάλογος
    article: ο
    ru: прайс-лист
    pos: noun
    note: буквально «список цен» — меню, где рядом с блюдами стоят цены
    example: Ο τιμοκατάλογος είναι στην πόρτα.
    exampleRu: Прайс-лист висит на двери.

  - el: παραγγελία
    article: η
    ru: заказ
    pos: noun
    example: Η παραγγελία σας είναι έτοιμη.
    exampleRu: Ваш заказ готов.

  - el: μερίδα
    article: η
    ru: порция
    pos: noun
    example: Θέλω μια μερίδα μουσακά.
    exampleRu: Я хочу порцию мусаки.

  - el: ορεκτικό
    article: το
    ru: закуска
    pos: noun
    example: Για ορεκτικό θέλουμε τζατζίκι.
    exampleRu: На закуску мы хотим дзадзики.

  - el: κύριο πιάτο
    article: το
    ru: основное блюдо
    pos: noun
    irregular: true
    note: словосочетание, склоняются оба слова
    cases:
      nom: [το κύριο πιάτο, τα κύρια πιάτα]
      gen: [του κύριου πιάτου, των κύριων πιάτων]
      acc: [το κύριο πιάτο, τα κύρια πιάτα]
      voc: [κύριο πιάτο, κύρια πιάτα]
    forms:
      plural: κύρια πιάτα
    example: Το κύριο πιάτο είναι ψάρι στη σχάρα.
    exampleRu: Основное блюдо — рыба на гриле.

  - el: μαγειρευτό φαγητό
    article: το
    ru: готовое блюдо, блюдо дня
    pos: noun
    irregular: true
    note: то, что уже сварено на кухне, — в отличие от блюд, которые готовят под заказ
    cases:
      nom: [το μαγειρευτό φαγητό, τα μαγειρευτά φαγητά]
      gen: [του μαγειρευτού φαγητού, των μαγειρευτών φαγητών]
      acc: [το μαγειρευτό φαγητό, τα μαγειρευτά φαγητά]
      voc: [μαγειρευτό φαγητό, μαγειρευτά φαγητά]
    forms:
      plural: μαγειρευτά φαγητά
    example: Στην ταβέρνα έχουν και μαγειρευτό φαγητό.
    exampleRu: В таверне есть и готовые блюда.

  - el: σχάρα
    article: η
    ru: решётка, гриль
    pos: noun
    example: Το κρέας ψήνεται στη σχάρα.
    exampleRu: Мясо готовится на гриле.

  - el: μελιτζανοσαλάτα
    article: η
    ru: салат из баклажанов
    pos: noun
    example: Η μελιτζανοσαλάτα είναι πολύ νόστιμη.
    exampleRu: Салат из баклажанов очень вкусный.

  - el: ξιφίας
    article: ο
    ru: рыба-меч
    pos: noun
    example: Ο ξιφίας στη σχάρα είναι εξαιρετικός.
    exampleRu: Рыба-меч на гриле превосходна.

  - el: μαρίδα
    article: η
    ru: мариди, мелкая рыба
    pos: noun
    note: мелкая рыбка, которую в таверне подают целиком и жареной
    example: Οι μαρίδες τρώγονται τηγανητές.
    exampleRu: Мариду едят жареной.

  - el: μαριδάκι
    article: το
    ru: рыбёшка
    pos: noun
    note: уменьшительное от «η μαρίδα»
    example: Πήραμε μαριδάκι για ορεκτικό.
    exampleRu: Мы взяли рыбёшку на закуску.

  - el: αλλεργία
    article: η
    ru: аллергия
    pos: noun
    example: Έχω αλλεργία στα θαλασσινά.
    exampleRu: У меня аллергия на морепродукты.

  - el: φέρνω
    ru: приносить
    pos: verb
    example: Ο σερβιτόρος φέρνει το νερό.
    exampleRu: Официант приносит воду.

  - el: διψάω
    ru: хотеть пить, испытывать жажду
    pos: verb
    example: Διψάω πολύ, θέλω ένα ποτήρι νερό.
    exampleRu: Я очень хочу пить, дайте стакан воды.

  - el: γεμιστός
    ru: фаршированный
    pos: adj
    example: Οι γεμιστές πιπεριές είναι νόστιμες.
    exampleRu: Фаршированные перцы вкусные.

  - el: μαγειρευτός
    ru: приготовленный, тушёный
    pos: adj
    example: Προτιμώ το μαγειρευτό κρέας από το ψητό.
    exampleRu: Я предпочитаю тушёное мясо жареному.

  - el: ντομάτες γεμιστές
    ru: фаршированные помидоры
    pos: phrase
    example: Σήμερα έχουν ντομάτες γεμιστές.
    exampleRu: Сегодня есть фаршированные помидоры.

  - el: το ποτήρι του κρασιού
    ru: бокал для вина
    pos: phrase
    example: Βάλε το κρασί στο ποτήρι του κρασιού.
    exampleRu: Налей вино в бокал для вина.

  - el: το ποτήρι του νερού
    ru: стакан для воды
    pos: phrase
    example: Το ποτήρι του νερού είναι μεγαλύτερο.
    exampleRu: Стакан для воды больше.

  - el: το φαγητό της ώρας
    ru: еда на заказ
    pos: phrase
    note: готовят сразу, когда вы закажете, — в отличие от «μαγειρευτό φαγητό»
    example: Το φαγητό της ώρας θέλει λίγη ώρα.
    exampleRu: Еда на заказ требует немного времени.

  - el: στη σχάρα
    ru: на гриле, на решётке
    pos: phrase
    example: Θέλω το ψάρι στη σχάρα.
    exampleRu: Я хочу рыбу на гриле.
