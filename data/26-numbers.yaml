# Числа. Набор подобран так, чтобы из него собиралось любое число до миллиона.
#
# Собирается это так:
#   13–19    δέκα + единица одним словом      δεκαεφτά
#   21–99    десяток и единица через пробел   σαράντα εφτά
#   101–999  сотня и остаток, εκατό → εκατόν  εκατόν είκοσι πέντε
#   1001+    χίλια или N χιλιάδες и остаток   τρεις χιλιάδες πεντακόσια
#   миллионы ένα εκατομμύριο, δύο εκατομμύρια
#
# По родам меняются только 1, 3, 4 (и составные с ними) да сотни. Всё
# остальное неизменяемо. Основная форма в карточке — средний род: им и
# считают вслух «ένα, δύο, τρία».
#
# Порядковые склоняются как прилагательные: πρώτος / πρώτη / πρώτο.
# Из количественных они не выводятся — έξι, но έκτος; σαράντα, но
# τεσσαρακοστός. Это отдельные слова, а не форма.
topic: Числа и счёт

words:
  # ─── 0–12: вывести нельзя, только выучить ──────────────────
  - el: μηδέν
    ru: "0, ноль"
    pos: num
    example: Η θερμοκρασία είναι μηδέν βαθμοί.
    exampleRu: Температура — ноль градусов.

  - el: ένα
    ru: "1, один"
    pos: num
    note: "по родам: ένας (м.) — μία или μια (ж.) — ένα (ср.). Это же слово работает и как неопределённый артикль «один, какой-то»"
    example: Θέλω ένα ποτήρι νερό.
    exampleRu: Я хочу стакан воды.

  - el: δύο
    ru: "2, два"
    pos: num
    note: не меняется по родам
    example: Μένω εδώ δύο χρόνια.
    exampleRu: Я живу здесь два года.

  - el: τρία
    ru: "3, три"
    pos: num
    note: "по родам: τρεις (м. и ж.) — τρία (ср.). «τρεις μέρες», но «τρία λεπτά»"
    example: Το σπίτι έχει τρία δωμάτια.
    exampleRu: В доме три комнаты.

  - el: τέσσερα
    ru: "4, четыре"
    pos: num
    note: "по родам: τέσσερις (м. и ж.) — τέσσερα (ср.)"
    example: Ο καφές κάνει τέσσερα ευρώ.
    exampleRu: Кофе стоит четыре евро.

  - el: πέντε
    ru: "5, пять"
    pos: num
    example: Θα έρθω σε πέντε λεπτά.
    exampleRu: Я приду через пять минут.

  - el: έξι
    ru: "6, шесть"
    pos: num
    example: Ξυπνάω στις έξι το πρωί.
    exampleRu: Я встаю в шесть утра.

  - el: εφτά
    ru: "7, семь"
    pos: num
    note: книжный вариант — επτά
    example: Δουλεύω εφτά ώρες τη μέρα.
    exampleRu: Я работаю семь часов в день.

  - el: οχτώ
    ru: "8, восемь"
    pos: num
    note: книжный вариант — οκτώ
    example: Το μάθημα αρχίζει στις οχτώ.
    exampleRu: Урок начинается в восемь.

  - el: εννιά
    ru: "9, девять"
    pos: num
    note: книжный вариант — εννέα
    example: Το μαγαζί κλείνει στις εννιά.
    exampleRu: Магазин закрывается в девять.

  - el: δέκα
    ru: "10, десять"
    pos: num
    example: Έχω δέκα ευρώ πάνω μου.
    exampleRu: У меня с собой десять евро.

  - el: έντεκα
    ru: "11, одиннадцать"
    pos: num
    note: книжный вариант — ένδεκα. Своё слово, не «δέκα ένα»
    example: Πάω για ύπνο στις έντεκα.
    exampleRu: Я иду спать в одиннадцать.

  - el: δώδεκα
    ru: "12, двенадцать"
    pos: num
    note: своё слово, не «δέκα δύο»
    example: Το τρένο φεύγει στις δώδεκα.
    exampleRu: Поезд уходит в двенадцать.

  # ─── 13–19: δέκα и единица одним словом ────────────────────
  - el: δεκατρία
    ru: "13, тринадцать"
    pos: num
    note: "по родам: δεκατρείς (м. и ж.) — δεκατρία (ср.)"
    example: Στο τραπέζι είναι δεκατρία άτομα.
    exampleRu: За столом тринадцать человек.

  - el: δεκατέσσερα
    ru: "14, четырнадцать"
    pos: num
    note: "по родам: δεκατέσσερις (м. и ж.) — δεκατέσσερα (ср.)"
    example: Το βιβλίο έχει δεκατέσσερα κεφάλαια.
    exampleRu: В книге четырнадцать глав.

  - el: δεκαπέντε
    ru: "15, пятнадцать"
    pos: num
    example: Θα γυρίσω σε δεκαπέντε μέρες.
    exampleRu: Я вернусь через пятнадцать дней.

  - el: δεκαέξι
    ru: "16, шестнадцать"
    pos: num
    example: Η κόρη μου είναι δεκαέξι χρονών.
    exampleRu: Моей дочери шестнадцать лет.

  - el: δεκαεφτά
    ru: "17, семнадцать"
    pos: num
    note: книжный вариант — δεκαεπτά
    example: Το δωμάτιο είναι δεκαεφτά τετραγωνικά.
    exampleRu: Комната — семнадцать квадратных метров.

  - el: δεκαοχτώ
    ru: "18, восемнадцать"
    pos: num
    note: книжный вариант — δεκαοκτώ
    example: Στα δεκαοχτώ παίρνεις δίπλωμα.
    exampleRu: В восемнадцать получают права.

  - el: δεκαεννιά
    ru: "19, девятнадцать"
    pos: num
    note: книжный вариант — δεκαεννέα
    example: Ο αδερφός μου είναι δεκαεννιά χρονών.
    exampleRu: Моему брату девятнадцать лет.

  # ─── Десятки. 21–99 = десяток и единица через пробел ────────
  - el: είκοσι
    ru: "20, двадцать"
    pos: num
    note: "дальше просто приставляется единица через пробел, без союза: είκοσι ένα, είκοσι δύο"
    example: Το εισιτήριο κάνει είκοσι ευρώ.
    exampleRu: Билет стоит двадцать евро.

  - el: τριάντα
    ru: "30, тридцать"
    pos: num
    example: Ο μήνας έχει τριάντα μέρες.
    exampleRu: В месяце тридцать дней.

  - el: σαράντα
    ru: "40, сорок"
    pos: num
    example: Είμαι σαράντα χρονών.
    exampleRu: Мне сорок лет.

  - el: πενήντα
    ru: "50, пятьдесят"
    pos: num
    example: Το ταξί κάνει πενήντα ευρώ.
    exampleRu: Такси стоит пятьдесят евро.

  - el: εξήντα
    ru: "60, шестьдесят"
    pos: num
    example: Ο πατέρας μου είναι εξήντα χρονών.
    exampleRu: Моему отцу шестьдесят лет.

  - el: εβδομήντα
    ru: "70, семьдесят"
    pos: num
    example: Στο λεωφορείο ήταν εβδομήντα άτομα.
    exampleRu: В автобусе было семьдесят человек.

  - el: ογδόντα
    ru: "80, восемьдесят"
    pos: num
    example: Η γιαγιά μου είναι ογδόντα χρονών.
    exampleRu: Моей бабушке восемьдесят лет.

  - el: ενενήντα
    ru: "90, девяносто"
    pos: num
    example: Το μάθημα διαρκεί ενενήντα λεπτά.
    exampleRu: Урок длится девяносто минут.

  # ─── Сотни. Основа своя у каждой, вывести нельзя ───────────
  - el: εκατό
    ru: "100, сто"
    pos: num
    note: "перед следующим числом становится εκατόν: 101 — εκατόν ένα. Само по себе не меняется по родам"
    example: Το βιβλίο έχει εκατό σελίδες.
    exampleRu: В книге сто страниц.

  - el: διακόσια
    ru: "200, двести"
    pos: num
    note: "по родам: διακόσιοι — διακόσιες — διακόσια. Так же и все остальные сотни"
    example: Πλήρωσα διακόσια ευρώ.
    exampleRu: Я заплатил двести евро.

  - el: τριακόσια
    ru: "300, триста"
    pos: num
    note: "по родам: τριακόσιοι — τριακόσιες — τριακόσια"
    example: Το ξενοδοχείο έχει τριακόσια δωμάτια.
    exampleRu: В отеле триста номеров.

  - el: τετρακόσια
    ru: "400, четыреста"
    pos: num
    note: "по родам: τετρακόσιοι — τετρακόσιες — τετρακόσια"
    example: Μέχρι την Αθήνα είναι τετρακόσια χιλιόμετρα.
    exampleRu: До Афин четыреста километров.

  - el: πεντακόσια
    ru: "500, пятьсот"
    pos: num
    note: "по родам: πεντακόσιοι — πεντακόσιες — πεντακόσια"
    example: Το ενοίκιο είναι πεντακόσια ευρώ.
    exampleRu: Аренда — пятьсот евро.

  - el: εξακόσια
    ru: "600, шестьсот"
    pos: num
    note: "по родам: εξακόσιοι — εξακόσιες — εξακόσια"
    example: Στο σχολείο έχει εξακόσια παιδιά.
    exampleRu: В школе шестьсот детей.

  - el: εφτακόσια
    ru: "700, семьсот"
    pos: num
    note: книжный вариант — επτακόσια
    example: Πάρε εφτακόσια γραμμάρια τυρί.
    exampleRu: Возьми семьсот грамм сыра.

  - el: οχτακόσια
    ru: "800, восемьсот"
    pos: num
    note: книжный вариант — οκτακόσια
    example: Το αεροπλάνο πετάει οχτακόσια χιλιόμετρα την ώρα.
    exampleRu: Самолёт летит восемьсот километров в час.

  - el: εννιακόσια
    ru: "900, девятьсот"
    pos: num
    note: книжный вариант — εννεακόσια
    example: Ο υπολογιστής κάνει εννιακόσια ευρώ.
    exampleRu: Компьютер стоит девятьсот евро.

  # ─── Тысячи и миллион ──────────────────────────────────────
  - el: χίλια
    ru: "1000, тысяча"
    pos: num
    note: "только ровно тысяча. По родам: χίλιοι — χίλιες — χίλια. От двух тысяч — уже χιλιάδες"
    example: Το ποδήλατο κάνει χίλια ευρώ.
    exampleRu: Велосипед стоит тысячу евро.

  - el: χιλιάδες
    ru: тысячи (от двух тысяч)
    pos: num
    note: "существительное женского рода η χιλιάδα: δύο χιλιάδες, τρεις χιλιάδες. Год тоже так — το 2026 = δύο χιλιάδες είκοσι έξι"
    example: Στη συναυλία ήρθαν δύο χιλιάδες άνθρωποι.
    exampleRu: На концерт пришли две тысячи человек.

  - el: εκατομμύριο
    ru: "1 000 000, миллион"
    pos: num
    note: "существительное среднего рода το εκατομμύριο, множественное τα εκατομμύρια: δύο εκατομμύρια"
    example: Το σπίτι κάνει ένα εκατομμύριο ευρώ.
    exampleRu: Дом стоит миллион евро.

  # ─── Порядковые 1–12 ───────────────────────────────────────
  - el: πρώτος
    ru: "первый, 1-й"
    pos: num
    note: "в датах первое число — женского рода: πρώτη Μαΐου. Остальные числа месяца количественные — δύο Μαΐου"
    example: Είμαι ο πρώτος στη σειρά.
    exampleRu: Я первый в очереди.

  - el: δεύτερος
    ru: "второй, 2-й"
    pos: num
    example: Ο δεύτερος γύρος είναι πιο δύσκολος.
    exampleRu: Второй круг труднее.

  - el: τρίτος
    ru: "третий, 3-й"
    pos: num
    example: Ήρθε τρίτος στον αγώνα.
    exampleRu: Он пришёл третьим в соревновании.

  - el: τέταρτος
    ru: "четвёртый, 4-й"
    pos: num
    example: Ο τέταρτος μήνας είναι ο Απρίλιος.
    exampleRu: Четвёртый месяц — апрель.

  - el: πέμπτος
    ru: "пятый, 5-й"
    pos: num
    example: Αυτός είναι ο πέμπτος καφές μου σήμερα.
    exampleRu: Это мой пятый кофе за сегодня.

  - el: έκτος
    ru: "шестой, 6-й"
    pos: num
    note: от «έξι» не выводится — своё слово. Не путать с «εκτός» (кроме, вне), там ударение на конце
    example: Ο έκτος μήνας είναι ο Ιούνιος.
    exampleRu: Шестой месяц — июнь.

  - el: έβδομος
    ru: "седьмой, 7-й"
    pos: num
    note: от «εφτά» не выводится — своё слово
    example: Ο έβδομος όροφος είναι ο τελευταίος.
    exampleRu: Седьмой этаж — последний.

  - el: όγδοος
    ru: "восьмой, 8-й"
    pos: num
    note: "по родам: όγδοος — όγδοη — όγδοο"
    example: Ο όγδοος μήνας είναι ο Αύγουστος.
    exampleRu: Восьмой месяц — август.

  - el: ένατος
    ru: "девятый, 9-й"
    pos: num
    note: от «εννιά» не выводится — своё слово
    example: Ο ένατος μήνας είναι ο Σεπτέμβριος.
    exampleRu: Девятый месяц — сентябрь.

  - el: δέκατος
    ru: "десятый, 10-й"
    pos: num
    example: Ο δέκατος μήνας είναι ο Οκτώβριος.
    exampleRu: Десятый месяц — октябрь.

  - el: ενδέκατος
    ru: "одиннадцатый, 11-й"
    pos: num
    note: в речи часто «εντέκατος», по образцу έντεκα
    example: Ο ενδέκατος μήνας είναι ο Νοέμβριος.
    exampleRu: Одиннадцатый месяц — ноябрь.

  - el: δωδέκατος
    ru: "двенадцатый, 12-й"
    pos: num
    example: Ο δωδέκατος μήνας είναι ο Δεκέμβριος.
    exampleRu: Двенадцатый месяц — декабрь.

  # ─── Порядковые десятки: основы старые, на количественные
  #     совсем не похожи ────────────────────────────────────────
  - el: εικοστός
    ru: "двадцатый, 20-й"
    pos: num
    example: Ζούμε στον εικοστό πρώτο αιώνα.
    exampleRu: Мы живём в двадцать первом веке.

  - el: τριακοστός
    ru: "тридцатый, 30-й"
    pos: num
    example: Αυτός είναι ο τριακοστός πελάτης σήμερα.
    exampleRu: Это тридцатый клиент за сегодня.

  - el: τεσσαρακοστός
    ru: "сороковой, 40-й"
    pos: num
    note: от «σαράντα» не выводится вовсе — основа другая
    example: Ο τεσσαρακοστός στη λίστα είμαι εγώ.
    exampleRu: Сороковой в списке — я.

  - el: πεντηκοστός
    ru: "пятидесятый, 50-й"
    pos: num
    example: Είναι ο πεντηκοστός μου αγώνας.
    exampleRu: Это мой пятидесятый матч.

  - el: εξηκοστός
    ru: "шестидесятый, 60-й"
    pos: num
    example: Ο εξηκοστός όροφος έχει ωραία θέα.
    exampleRu: С шестидесятого этажа хороший вид.

  - el: εβδομηκοστός
    ru: "семидесятый, 70-й"
    pos: num
    example: Ο εβδομηκοστός στη σειρά περιμένει ακόμα.
    exampleRu: Семидесятый в очереди ещё ждёт.

  - el: ογδοηκοστός
    ru: "восьмидесятый, 80-й"
    pos: num
    example: Ο ογδοηκοστός μαθητής μπήκε τελευταίος.
    exampleRu: Восьмидесятый ученик вошёл последним.

  - el: ενενηκοστός
    ru: "девяностый, 90-й"
    pos: num
    example: Ο ενενηκοστός αριθμός στη λίστα λείπει.
    exampleRu: Девяностого номера в списке нет.

  - el: εκατοστός
    ru: "сотый, 100-й"
    pos: num
    note: "сотни дальше по образцу: διακοσιοστός, τριακοσιοστός"
    example: Είναι ο εκατοστός επισκέπτης του μουσείου.
    exampleRu: Он сотый посетитель музея.

  - el: χιλιοστός
    ru: "тысячный, 1000-й"
    pos: num
    example: Ο χιλιοστός πελάτης παίρνει δώρο.
    exampleRu: Тысячный клиент получает подарок.
