    cases:
      nom: [~, οι γιαγιάδες]
      gen: [~, των γιαγιάδων]
      acc: [~, τις γιαγιάδες]
      voc: [~, γιαγιάδες]
    forms:
      plural: γιαγιάδες
    example: Η γιαγιά μου κάνει γλυκά.
