    pos: noun
    example: Είναι ένα ωραίο ζευγάρι.
    exampleRu: Они прекрасная пара.

  - el: παππούς
    article: ο
    ru: дедушка
    pos: noun
    irregular: true
    note: тип на -ούς, правила его не выводят; множественное οι παππούδες
    cases:
      nom: [ο παππούς, οι παππούδες]
      gen: [του παππού, των παππούδων]
      acc: [τον παππού, τους παππούδες]
      voc: [παππού, παππούδες]
    forms:
      plural: παππούδες
    example: Ο παππούς μου είναι ογδόντα χρονών.
    exampleRu: Моему дедушке восемьдесят лет.

  - el: γιαγιά
    article: η
