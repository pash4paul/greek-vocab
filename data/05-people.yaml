    example: Η εθνικότητα δεν έχει σημασία εδώ.
    exampleRu: Национальность здесь не имеет значения.

  - el: υπηκοότητα
    article: η
    ru: гражданство
    pos: noun
    example: Έχει ελληνική υπηκοότητα.
