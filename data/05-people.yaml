    example: Ο αδελφός μου είναι παντρεμένος.
    exampleRu: Мой брат женат.

  - el: αρραβωνιασμένος
    ru: помолвленный
    pos: adj
    example: Είμαι αρραβωνιασμένος από τον Μάιο.
    exampleRu: Я помолвлен с мая.

  - el: ελεύθερος
    ru: свободный
    pos: adj
    example: Είμαι ελεύθερος, δεν είμαι παντρεμένος.
    exampleRu: Я свободен, не женат.

  - el: διαζευγμένος
    ru: разведённый
    pos: adj
    example: Η αδελφή μου είναι διαζευγμένη.
    exampleRu: Моя сестра в разводе.

  - el: χωρισμένος
    ru: разведённый, расставшийся
    pos: adj
    example: Είναι χωρισμένος εδώ και δύο χρόνια.
    exampleRu: Он в разводе уже два года.

  - el: ερωτευμένος
    ru: влюблённый
    pos: adj
    example: Είναι ερωτευμένος με τη Μαρία.
    exampleRu: Он влюблён в Марию.

  - el: αγαπημένος
    ru: любимый
    pos: adj
    example: Αυτό είναι το αγαπημένο μου τραγούδι.
    exampleRu: Это моя любимая песня.

  - el: γνωρίζω
    ru: знать, быть знакомым
    pos: verb
    example: Γνωρίζω καλά την πόλη.
    exampleRu: Я хорошо знаю город.

  - el: αγαπάω
    ru: любить
    pos: verb
    example: Αγαπάω την οικογένειά μου.
    exampleRu: Я люблю свою семью.

  - el: λατρεύω
    ru: обожать
    pos: verb
    example: Λατρεύω τον ελληνικό καφέ.
    exampleRu: Я обожаю греческий кофе.

  - el: λέγομαι
    ru: называться, зваться
    pos: verb
    irregular: true
    note: среднепассивный залог; «με λένε» — «меня зовут»
    forms:
      present: [λέγομαι, λέγεσαι, λέγεται, λεγόμαστε, λέγεστε, λέγονται]
    example: Λέγομαι Άννα και είμαι από τη Ρωσία.
    exampleRu: Меня зовут Анна, и я из России.

  - el: γονέας
    article: ο
    ru: родитель
    pos: noun
    irregular: true
    note: почти всегда во множественном числе — οι γονείς, «родители»
    cases:
      nom: [~, οι γονείς]
      gen: [~, των γονέων]
      acc: [~, τους γονείς]
      voc: [~, γονείς]
    forms:
      plural: γονείς
    example: Κάθε γονέας θέλει το καλύτερο για το παιδί του.
    exampleRu: Каждый родитель хочет лучшего для своего ребёнка.

  - el: μπαμπάς
    article: ο
    ru: папа
    pos: noun
    example: Ο μπαμπάς μου είναι γιατρός.
    exampleRu: Мой папа — врач.

  - el: μαμά
    article: η
    ru: мама
