  - el: καταγωγή
    article: η
    ru: происхождение, корни (откуда родом)
    pos: noun
    example: Είμαι ελληνικής καταγωγής.
    exampleRu: Я греческого происхождения.

  - el: ζωή
    article: η
    ru: жизнь
    pos: noun
    example: Η ζωή στην Ελλάδα είναι ήρεμη.
