    pos: noun
    example: Βγαίνω με την παρέα μου το βράδυ.
    exampleRu: Вечером я гуляю с друзьями.

  - el: χήρος
    article: ο
    ru: вдовец
    pos: noun
    example: Ο θείος μου είναι χήρος.
    exampleRu: Мой дядя вдовец.

  - el: χήρα
    article: η
    ru: вдова
    pos: noun
    example: Η γιαγιά μου είναι χήρα.
    exampleRu: Моя бабушка вдова.

  - el: κόρη
    article: η
    ru: дочь
    pos: noun
    cases:
      nom: [~, οι κόρες]
      acc: [~, τις κόρες]
    example: Η κόρη μου πάει στο σχολείο.
    exampleRu: Моя дочь ходит в школу.

  - el: όνομα
    article: το
    ru: имя
    pos: noun
    example: Το όνομά μου είναι Παύλος.
