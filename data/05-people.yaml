topic: Люди и семья
lesson: "06"

words:
  - el: άντρας
    article: ο
    ru: мужчина, муж
    pos: noun
    example: Ο άντρας μου δουλεύει εδώ.
    exampleRu: Мой муж работает здесь.

  - el: γυναίκα
    article: η
    ru: женщина, жена
    pos: noun
    cases:
      gen: [~, των γυναικών]
    example: Η γυναίκα μου είναι δασκάλα.
    exampleRu: Моя жена — учительница.

  - el: παιδί
    article: το
    ru: ребёнок
    pos: noun
    example: Το παιδί παίζει στην αυλή.
    exampleRu: Ребёнок играет во дворе.

  - el: αγόρι
    article: το
    ru: мальчик
    pos: noun
    example: Το αγόρι παίζει στην αυλή.
    exampleRu: Мальчик играет во дворе.

  - el: κορίτσι
    article: το
    ru: девочка
    pos: noun
    example: Το κορίτσι διαβάζει ένα βιβλίο.
    exampleRu: Девочка читает книгу.

  - el: κοπέλα
    article: η
    ru: девушка
    pos: noun
    example: Η κοπέλα δουλεύει σε μια καφετέρια.
    exampleRu: Девушка работает в кафе.

  - el: πατέρας
    article: ο
    ru: отец
    pos: noun
    cases:
      gen: [~, των πατέρων]
    example: Ο πατέρας μου δουλεύει στην τράπεζα.
    exampleRu: Мой отец работает в банке.

  - el: μητέρα
    article: η
    ru: мать
    pos: noun
    cases:
      gen: [~, των μητέρων]
    example: Η μητέρα μου μαγειρεύει πολύ καλά.
    exampleRu: Моя мама очень хорошо готовит.

  - el: οικογένεια
    article: η
    ru: семья
    pos: noun
    cases:
      gen: [~, των οικογενειών]
    example: Η οικογένειά μου μένει στην Αθήνα.
    exampleRu: Моя семья живёт в Афинах.

  - el: φίλος
    article: ο
    ru: друг
    pos: noun
    example: Ο φίλος μου έρχεται αύριο.
    exampleRu: Мой друг приезжает завтра.

  - el: φίλη
    article: η
    ru: подруга
    pos: noun
    cases:
      nom: [~, οι φίλες]
      acc: [~, τις φίλες]
    example: Η φίλη μου μένει στην Αθήνα.
    exampleRu: Моя подруга живёт в Афинах.

  - el: κύριος
    article: ο
    ru: господин
    pos: noun
    note: звательная форма — κύριε
    example: Καλημέρα, κύριε Γιώργο!
    exampleRu: Доброе утро, господин Йоргос!

  - el: κυρία
    article: η
    ru: госпожа
    pos: noun
    note: звательная форма — κυρία
    example: Η κυρία Ελένη μένει δίπλα.
    exampleRu: Госпожа Элени живёт рядом.

  - el: παρέα
    article: η
    ru: компания, друзья
    pos: noun
    example: Βγαίνω με την παρέα μου το βράδυ.
    exampleRu: Вечером я гуляю с друзьями.

  - el: χήρος
    article: ο
    ru: вдовец
    pos: noun
    example: Ο θείος μου είναι χήρος.
    exampleRu: Мой дядя вдовец.

  - el: χήρα
    article: η
    ru: вдова
    pos: noun
    example: Η γιαγιά μου είναι χήρα.
    exampleRu: Моя бабушка вдова.

  - el: κόρη
    article: η
    ru: дочь
    pos: noun
    cases:
      nom: [~, οι κόρες]
      acc: [~, τις κόρες]
    example: Η κόρη μου πάει στο σχολείο.
    exampleRu: Моя дочь ходит в школу.

  - el: όνομα
    article: το
    ru: имя
    pos: noun
    example: Το όνομά μου είναι Παύλος.
    exampleRu: Меня зовут Павел.

  - el: επώνυμο
    article: το
    ru: фамилия
    pos: noun
    example: Γράψτε εδώ το επώνυμο και το όνομα.
    exampleRu: Напишите здесь фамилию и имя.

  - el: εθνικότητα
    article: η
    ru: национальность
    pos: noun
    example: Η εθνικότητα δεν έχει σημασία εδώ.
    exampleRu: Национальность здесь не имеет значения.

  - el: υπηκοότητα
    article: η
    ru: гражданство
    pos: noun
    example: Έχει ελληνική υπηκοότητα.
    exampleRu: У него греческое гражданство.

  - el: καταγωγή
    article: η
    ru: происхождение, корни (откуда родом)
    pos: noun
    example: Είμαι ελληνικής καταγωγής.
    exampleRu: Я греческого происхождения.

  - el: ζωή
    article: η
    ru: жизнь
    pos: noun
    example: Η ζωή στην Ελλάδα είναι ήρεμη.
    exampleRu: Жизнь в Греции спокойная.

  - el: κόσμος
    article: ο
    ru: мир, люди
    pos: noun
    example: Ο κόσμος περιμένει στη στάση.
    exampleRu: Люди ждут на остановке.

  - el: παντρεμένος
    ru: женат, замужем
    pos: adj
    example: Ο αδελφός μου είναι παντρεμένος.
    exampleRu: Мой брат женат.

  - el: αρραβωνιασμένος
    ru: помолвленный
    pos: adj
    example: Είμαι αρραβωνιασμένος από τον Μάιο.
    exampleRu: Я помолвлен с мая.

  - el: ελεύθερος
    ru: свободный
    pos: adj
    example: Είμαι ελεύθερος, δεν είμαι παντρεμένος.
    exampleRu: Я свободен, не женат.

  - el: διαζευγμένος
    ru: разведённый
    pos: adj
    example: Η αδελφή μου είναι διαζευγμένη.
    exampleRu: Моя сестра в разводе.

  - el: χωρισμένος
    ru: разведённый, расставшийся
    pos: adj
    example: Είναι χωρισμένος εδώ και δύο χρόνια.
    exampleRu: Он в разводе уже два года.

  - el: ερωτευμένος
    ru: влюблённый
    pos: adj
    example: Είναι ερωτευμένος με τη Μαρία.
    exampleRu: Он влюблён в Марию.

  - el: αγαπημένος
    ru: любимый
    pos: adj
    example: Αυτό είναι το αγαπημένο μου τραγούδι.
    exampleRu: Это моя любимая песня.

  - el: γνωρίζω
    ru: знать, быть знакомым
    pos: verb
    example: Γνωρίζω καλά την πόλη.
    exampleRu: Я хорошо знаю город.

  - el: αγαπάω
    ru: любить
    pos: verb
    example: Αγαπάω την οικογένειά μου.
    exampleRu: Я люблю свою семью.

  - el: λατρεύω
    ru: обожать
    pos: verb
    example: Λατρεύω τον ελληνικό καφέ.
    exampleRu: Я обожаю греческий кофе.

  - el: λέγομαι
    ru: называться, зваться
    pos: verb
    irregular: true
    note: среднепассивный залог; «με λένε» — «меня зовут»
    forms:
      present: [λέγομαι, λέγεσαι, λέγεται, λεγόμαστε, λέγεστε, λέγονται]
    example: Λέγομαι Άννα και είμαι από τη Ρωσία.
    exampleRu: Меня зовут Анна, и я из России.
