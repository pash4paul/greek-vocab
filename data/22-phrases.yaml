topic: Полезные выражения
lesson: "23"

words:
  - el: καλώς ήρθες
    ru: добро пожаловать
    pos: phrase
    note: на «вы» — καλώς ήρθατε
    example: Καλώς ήρθες στο σπίτι μας!
    exampleRu: Добро пожаловать в наш дом!

  - el: χαίρετε
    ru: приветствую вас, рад встрече
    pos: phrase
    example: Χαίρετε, τι κάνετε;
    exampleRu: Приветствую, как вы?

  - el: χαιρετισμός
    article: ο
    ru: привет, приветствие
    pos: noun
    example: Στείλε έναν χαιρετισμό στη μητέρα σου.
    exampleRu: Передай привет своей маме.

  - el: ορίστε
    ru: пожалуйста, вот, слушаю
    pos: phrase
    note: при передаче предмета и при ответе на зов
    example: Ορίστε, πάρτε το.
    exampleRu: Вот, возьмите.

  - el: με λένε
    ru: меня зовут
    pos: phrase
    example: Με λένε Παύλο.
    exampleRu: Меня зовут Павел.

  - el: τι κάνεις
    ru: как дела?
    pos: phrase
    example: Γεια σου, Νίκο, τι κάνεις;
    exampleRu: Привет, Никос, как дела?

  - el: πώς είσαι
    ru: как ты?
    pos: phrase
    example: Πώς είσαι μετά το ταξίδι;
    exampleRu: Как ты после поездки?

  - el: μια χαρά
    ru: отлично
    pos: phrase
    example: Είμαι μια χαρά, ευχαριστώ.
    exampleRu: У меня всё отлично, спасибо.

  - el: έτσι κι έτσι
    ru: так себе
    pos: phrase
    example: Πώς πάει η δουλειά; Έτσι κι έτσι.
    exampleRu: Как работа? Так себе.

  - el: πώς το λένε αυτό ελληνικά
    ru: как это называется по-гречески?
    pos: phrase
    example: Συγγνώμη, πώς το λένε αυτό ελληνικά;
    exampleRu: Извините, как это называется по-гречески?

  - el: τι ωραία
    ru: как замечательно!
    pos: phrase
    example: Τι ωραία που ήρθες!
    exampleRu: Как здорово, что ты пришёл!

  - el: δεν πειράζει
    ru: не важно, ничего страшного
    pos: phrase
    example: Δεν πειράζει, θα το κάνω εγώ.
    exampleRu: Ничего страшного, я сам это сделаю.

  - el: καλό μεσημέρι
    ru: хорошего дня!
    pos: phrase
    example: Καλό μεσημέρι και καλή όρεξη!
    exampleRu: Хорошего дня и приятного аппетита!

  - el: κάτι άλλο
    ru: что-то ещё
    pos: phrase
    example: Θέλετε κάτι άλλο;
    exampleRu: Хотите что-нибудь ещё?

  - el: τίποτε άλλο
    ru: больше ничего
    pos: phrase
    example: Τίποτε άλλο, ευχαριστώ.
    exampleRu: Больше ничего, спасибо.

  - el: κι άλλο ένα
    ru: и ещё один
    pos: phrase
    example: Φέρτε μου κι άλλο ένα ποτήρι νερό.
    exampleRu: Принесите мне ещё один стакан воды.

  - el: πρώτα-πρώτα
    ru: сначала, первым делом
    pos: phrase
    example: Πρώτα-πρώτα θέλω έναν καφέ.
    exampleRu: Прежде всего я хочу кофе.

  - el: στη συνέχεια
    ru: затем, далее
    pos: phrase
    example: Στη συνέχεια πάμε στο μουσείο.
    exampleRu: Затем мы идём в музей.

  - el: στο τέλος
    ru: в конце
    pos: phrase
    example: Στο τέλος της ταινίας έκλαψα.
    exampleRu: В конце фильма я расплакался.

  - el: είναι η σειρά μου
    ru: сейчас моя очередь
    pos: phrase
    example: Συγγνώμη, είναι η σειρά μου.
    exampleRu: Извините, сейчас моя очередь.

  - el: έχω δίκιο
    ru: я прав
    pos: phrase
    example: Νομίζω πως έχω δίκιο.
    exampleRu: Думаю, я прав.

  - el: δίκιο
    article: το
    ru: право, справедливость
    pos: noun
    example: Το δίκιο είναι με το μέρος σου.
    exampleRu: Правда на твоей стороне.

  - el: λόγω ζέστης
    ru: в связи с жарой
    pos: phrase
    example: Το μαγαζί έκλεισε λόγω ζέστης.
    exampleRu: Магазин закрылся из-за жары.

  - el: χαιρετισμούς σε
    ru: передавай привет...
    pos: phrase
    example: Χαιρετισμούς σε όλη την οικογένεια!
    exampleRu: Привет всей семье!

  - el: γεννήθηκα
    ru: я родился
    pos: phrase
    note: форма прошедшего времени от γεννιέμαι
    example: Γεννήθηκα στη Μόσχα.
    exampleRu: Я родился в Москве.

  - el: ήταν
    ru: был, была, было
    pos: phrase
    note: прошедшее время от είμαι
    example: Ο καιρός ήταν ωραίος.
    exampleRu: Погода была хорошая.

  - el: θα είναι
    ru: будет, будут
    pos: phrase
    example: Αύριο θα είναι ζέστη.
    exampleRu: Завтра будет жара.

  - el: θα ήθελα
    ru: я хотел бы
    pos: phrase
    example: Θα ήθελα έναν καφέ, παρακαλώ.
    exampleRu: Я хотел бы кофе, пожалуйста.

  - el: υπάρχει
    ru: существует, имеется
    pos: phrase
    example: Υπάρχει ένα φαρμακείο εδώ κοντά;
    exampleRu: Здесь рядом есть аптека?

  - el: ευκαιρία
    article: η
    ru: возможность
    pos: noun
    example: Είναι μια καλή ευκαιρία.
    exampleRu: Это хорошая возможность.

  - el: ιδέα
    article: η
    ru: идея
    pos: noun
    example: Έχω μια καλή ιδέα.
    exampleRu: У меня есть хорошая идея.

  - el: χαρά
    article: η
    ru: радость
    pos: noun
    cases:
      gen: [~, των χαρών]
    example: Η χαρά των παιδιών ήταν μεγάλη.
    exampleRu: Радость детей была велика.

  - el: κίνηση
    article: η
    ru: движение
    pos: noun
    irregular: true
    cases:
      nom: [~, οι κινήσεις]
      gen: [~, των κινήσεων]
      acc: [~, τις κινήσεις]
    forms:
      plural: κινήσεις
    example: Η κίνηση στον δρόμο είναι πολλή.
    exampleRu: На дороге большое движение.

  - el: ένωση
    article: η
    ru: союз
    pos: noun
    irregular: true
    cases:
      nom: [~, οι ενώσεις]
      gen: [~, των ενώσεων]
      acc: [~, τις ενώσεις]
    forms:
      plural: ενώσεις
    example: Η ένωση κάνει τη δύναμη.
    exampleRu: В единстве сила.

  - el: προέλευση
    article: η
    ru: происхождение, источник
    pos: noun
    irregular: true
    cases:
      nom: [~, οι προελεύσεις]
      gen: [~, των προελεύσεων]
      acc: [~, τις προελεύσεις]
    forms:
      plural: προελεύσεις
    example: Ποια είναι η προέλευση της λέξης;
    exampleRu: Каково происхождение слова?
