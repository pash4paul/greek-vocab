# ФОРМАТ ФАЙЛА СО СЛОВАМИ
#
# Один файл = одна тема (или один урок из Miro). Имя файла роли не играет,
# но числовой префикс удобен для порядка. Обязательны только `el` и `ru`,
# всё остальное — по желанию, каждое поле открывает новые упражнения.
#
#   el          греческое слово. Существительные — БЕЗ артикля (он в `article`),
#               глаголы — в 1 л. ед. ч. наст. вр. (μιλάω), прилагательные — в м. р.
#   ru          перевод. Несколько значений — через запятую.
#   pos         noun | verb | adj | adv | phrase | prep | pron | num | other
#   article     ο | η | το — только для существительных. Учится вместе со словом.
#   forms       plural (сущ.) · present: [6 форм] (глаг.) · gender: [3 формы] (прил.)
#   example     предложение с этим словом → включает упражнение «пропуск»
#   exampleRu   перевод примера
#   note        подсказка/мнемоника, показывается на обороте карточки
#   tags        произвольные метки для фильтров
#
# После правки: npm run check — проверит на ошибки, дубли и забытые артикли.

topic: Приветствия и вежливость
lesson: "01"

words:
  - el: καλημέρα
    ru: доброе утро, добрый день
    pos: phrase
    note: до полудня; буквально «хороший день»
    tags: [приветствие]
    example: Καλημέρα, τι κάνεις;
    exampleRu: Доброе утро, как дела?

  - el: καλησπέρα
    ru: добрый вечер
    pos: phrase
    tags: [приветствие]
    example: Καλησπέρα, πώς είστε;
    exampleRu: Добрый вечер, как вы?

  - el: καληνύχτα
    ru: спокойной ночи
    pos: phrase
    note: только при прощании на ночь, не как приветствие
    tags: [приветствие]
    example: Καληνύχτα, όνειρα γλυκά.
    exampleRu: Спокойной ночи, сладких снов.

  - el: γεια σου
    ru: привет
    pos: phrase
    note: на «ты»; универсально и при встрече, и при прощании
    tags: [приветствие]
    example: Γεια σου, Μαρία!
    exampleRu: Привет, Мария!

  - el: γεια σας
    ru: здравствуйте
    pos: phrase
    note: на «вы» или к нескольким людям
    tags: [приветствие]
    example: Γεια σας, τι θα πάρετε;
    exampleRu: Здравствуйте, что будете заказывать?

  - el: αντίο
    ru: до свидания
    pos: phrase
    tags: [приветствие]
    example: Αντίο και καλό ταξίδι!
    exampleRu: До свидания и хорошей поездки!

  - el: ευχαριστώ
    ru: спасибо
    pos: phrase
    example: Ευχαριστώ πολύ!
    exampleRu: Большое спасибо!
    tags: [вежливость]

  - el: παρακαλώ
    ru: пожалуйста, не за что
    pos: phrase
    note: и ответ на «спасибо», и «прошу» при просьбе
    tags: [вежливость]
    example: Μια στιγμή, παρακαλώ.
    exampleRu: Одну минуту, пожалуйста.

  - el: συγγνώμη
    ru: извините, простите
    pos: phrase
    note: то же слово как существительное — η συγγνώμη, «извинение»
    tags: [вежливость]
    example: Συγγνώμη, πού είναι η στάση;
    exampleRu: Извините, где остановка?

  - el: ναι
    ru: да
    pos: adv
    example: Ναι, βέβαια.
    exampleRu: Да, конечно.

  - el: όχι
    ru: нет
    pos: adv
    example: Όχι, ευχαριστώ.
    exampleRu: Нет, спасибо.

  - el: καλά
    ru: хорошо
    pos: adv
    example: Είμαι καλά, ευχαριστώ.
    exampleRu: У меня всё хорошо, спасибо.

  - el: πολύ
    ru: очень, много
    pos: adv
    example: Μιλάς πολύ γρήγορα.
    exampleRu: Ты говоришь очень быстро.

  - el: λίγο
    ru: немного
    pos: adv
    example: Μιλάω λίγο ελληνικά.
    exampleRu: Я немного говорю по-гречески.
