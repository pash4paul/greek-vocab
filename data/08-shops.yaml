topic: Магазины и продавцы
lesson: "09"

words:
  - el: κατάστημα
    article: το
    ru: магазин (заведение, официально)
    pos: noun
    note: слово с вывески и из документов. В речи то же самое — το μαγαζί
    example: Το κατάστημα ανοίγει στις δέκα.
    exampleRu: Магазин открывается в десять.

  - el: μαγαζί
    article: το
    ru: лавка, магазинчик (разговорное)
    pos: noun
    note: обычное слово в речи. На вывеске и в документах — το κατάστημα
    example: Το μαγαζί είναι κλειστό σήμερα.
    exampleRu: Лавка сегодня закрыта.

  - el: αγορά
    article: η
    ru: рынок, покупка
    pos: noun
    cases:
      gen: [~, των αγορών]
    example: Η αγορά είναι ανοιχτή κάθε μέρα.
    exampleRu: Рынок открыт каждый день.

  - el: λαϊκή
    article: η
    ru: базар
    pos: noun
    note: полностью — η λαϊκή αγορά
    example: Πάω στη λαϊκή για φρούτα.
    exampleRu: Я иду на базар за фруктами.

  - el: σούπερ μάρκετ
    article: το
    ru: супермаркет
    pos: noun
    irregular: true
    note: заимствование, не склоняется
    example: Το σούπερ μάρκετ είναι ανοιχτό μέχρι τις εννιά.
    exampleRu: Супермаркет открыт до девяти.

  - el: υπεραγορά
    article: η
    ru: гипермаркет
    pos: noun
    cases:
      gen: [~, των υπεραγορών]
    example: Η υπεραγορά έχει τα πάντα.
    exampleRu: В гипермаркете есть всё.

  - el: φούρνος
    article: ο
    ru: печь, пекарня
    pos: noun
    example: Αγοράζω ψωμί από τον φούρνο.
    exampleRu: Я покупаю хлеб в пекарне.

  - el: αρτοποιείο
    article: το
    ru: хлебный магазин
    pos: noun
    example: Το αρτοποιείο πουλάει και γλυκά.
    exampleRu: Хлебный магазин продаёт и сладости.

  - el: ζαχαροπλαστείο
    article: το
    ru: кондитерская
    pos: noun
    example: Αγοράσαμε τούρτα από το ζαχαροπλαστείο.
    exampleRu: Мы купили торт в кондитерской.

  - el: ανθοπωλείο
    article: το
    ru: цветочный магазин
    pos: noun
    example: Πήρα λουλούδια από το ανθοπωλείο.
    exampleRu: Я взял цветы в цветочном магазине.

  - el: βιβλιοπωλείο
    article: το
    ru: книжный магазин
    pos: noun
    example: Το βιβλιοπωλείο έχει ελληνικά βιβλία.
    exampleRu: В книжном магазине есть греческие книги.

  - el: χαρτοπωλείο
    article: το
    ru: магазин канцтоваров
    pos: noun
    example: Θέλω ένα τετράδιο από το χαρτοπωλείο.
    exampleRu: Мне нужна тетрадь из магазина канцтоваров.

  - el: μανάβικο
    article: το
    ru: овощной магазин
    pos: noun
    example: Το μανάβικο είναι στη γωνία.
    exampleRu: Овощной магазин на углу.

  - el: κρεοπωλείο
    article: το
    ru: мясной магазин
    pos: noun
    example: Το κρεοπωλείο είναι κλειστό σήμερα.
    exampleRu: Мясной магазин сегодня закрыт.

  - el: χασάπικο
    article: το
    ru: мясная лавка
    pos: noun
    example: Πάω στο χασάπικο για κιμά.
    exampleRu: Я иду в мясную лавку за фаршем.

  - el: ιχθυοπωλείο
    article: το
    ru: рыбный магазин
    pos: noun
    example: Το ιχθυοπωλείο έχει φρέσκα ψάρια.
    exampleRu: В рыбном магазине свежая рыба.

  - el: ψαράδικο
    article: το
    ru: рыбная лавка
    pos: noun
    example: Αγόρασα ψάρι από το ψαράδικο.
    exampleRu: Я купил рыбу в рыбной лавке.

  - el: φαρμακείο
    article: το
    ru: аптека
    pos: noun
    example: Το φαρμακείο είναι ανοιχτό όλη νύχτα.
    exampleRu: Аптека открыта всю ночь.

  - el: καθαριστήριο
    article: το
    ru: химчистка
    pos: noun
    example: Άφησα το παλτό στο καθαριστήριο.
    exampleRu: Я оставил пальто в химчистке.

  - el: περίπτερο
    article: το
    ru: киоск
    pos: noun

  # ─── Продавцы ───────────────────────────────────────────────
    example: Το περίπτερο πουλάει εφημερίδες.
    exampleRu: Киоск продаёт газеты.
  - el: καταστηματάρχης
    article: ο
    ru: продавец, владелец магазина
    pos: noun
    example: Ο καταστηματάρχης μας κάνει έκπτωση.
    exampleRu: Владелец магазина делает нам скидку.

  - el: φούρναρης
    article: ο
    irregular: true
    note: >-
      разговорное название профессии: множественное на -ηδες,
      а не на -ες как у μαθητής → μαθητές
    forms:
      plural: φουρνάρηδες
    cases:
      nom: [~, οι φουρνάρηδες]
      gen: [~, των φουρνάρηδων]
      acc: [~, τους φουρνάρηδες]
      voc: [~, φουρνάρηδες]
    ru: пекарь
    pos: noun
    example: Ο φούρναρης ανοίγει πολύ νωρίς.
    exampleRu: Пекарь открывается очень рано.

  - el: ζαχαροπλάστης
    article: ο
    ru: кондитер
    pos: noun
    example: Ο ζαχαροπλάστης φτιάχνει ωραίες τούρτες.
    exampleRu: Кондитер делает прекрасные торты.

  - el: ανθοπώλης
    article: ο
    ru: продавец цветов
    pos: noun
    example: Ο ανθοπώλης μου έδωσε δέκα τριαντάφυλλα.
    exampleRu: Продавец цветов дал мне десять роз.

  - el: βιβλιοπώλης
    article: ο
    ru: продавец книг
    pos: noun
    example: Ο βιβλιοπώλης ξέρει όλα τα βιβλία του.
    exampleRu: Продавец книг знает все свои книги.

  - el: μανάβης
    article: ο
    irregular: true
    note: >-
      разговорное название профессии: множественное на -ηδες,
      а не на -ες как у μαθητής → μαθητές
    forms:
      plural: μανάβηδες
    cases:
      nom: [~, οι μανάβηδες]
      gen: [~, των μανάβηδων]
      acc: [~, τους μανάβηδες]
      voc: [~, μανάβηδες]
    ru: зеленщик
    pos: noun
    example: Ο μανάβης ζυγίζει τα πορτοκάλια.
    exampleRu: Зеленщик взвешивает апельсины.

  - el: κρεοπώλης
    article: ο
    ru: продавец мяса
    pos: noun
    example: Ο κρεοπώλης δουλεύει από το πρωί.
    exampleRu: Продавец мяса работает с утра.

  - el: χασάπης
    article: ο
    irregular: true
    note: >-
      разговорное название профессии: множественное на -ηδες,
      а не на -ες как у μαθητής → μαθητές
    forms:
      plural: χασάπηδες
    cases:
      nom: [~, οι χασάπηδες]
      gen: [~, των χασάπηδων]
      acc: [~, τους χασάπηδες]
      voc: [~, χασάπηδες]
    ru: мясник
    pos: noun
    example: Ο χασάπης κόβει το κρέας.
    exampleRu: Мясник режет мясо.

  - el: περιπτεράς
    article: ο
    ru: продавец киоска
    pos: noun
    example: Ο περιπτεράς ξέρει όλα τα νέα.
    exampleRu: Продавец киоска знает все новости.

  - el: ταχυδρόμος
    article: ο
    ru: почтальон
    pos: noun
    example: Ο ταχυδρόμος έφερε ένα γράμμα.
    exampleRu: Почтальон принёс письмо.

  - el: φαρμακοποιός
    article: ο
    ru: аптекарь, фармацевт
    pos: noun
    example: Ρώτησε τον φαρμακοποιό.
    exampleRu: Спроси у фармацевта.

  - el: ηλεκτρολόγος
    article: ο
    ru: электрик
    pos: noun

  # ─── Покупки ────────────────────────────────────────────────
    example: Ο ηλεκτρολόγος έρχεται αύριο.
    exampleRu: Электрик придёт завтра.
  - el: απόδειξη
    article: η
    ru: чек, доказательство
    pos: noun
    irregular: true
    cases:
      nom: [~, οι αποδείξεις]
      gen: [~, των αποδείξεων]
      acc: [~, τις αποδείξεις]
    forms:
      plural: αποδείξεις
    example: Θέλετε την απόδειξη;
    exampleRu: Вам нужен чек?

  - el: κέρμα
    article: το
    ru: монетка
    pos: noun
    example: Βάλε ένα κέρμα στο μηχάνημα.
    exampleRu: Брось монетку в автомат.

  - el: χρήμα
    article: το
    ru: деньги
    pos: noun
    note: обычно во мн. ч. — τα χρήματα
    example: Δεν έχω χρήματα πάνω μου.
    exampleRu: У меня нет с собой денег.

  - el: νόμισμα
    article: το
    ru: денежная единица, монета
    pos: noun
    example: Το ευρώ είναι το νόμισμα της Ελλάδας.
    exampleRu: Евро — денежная единица Греции.

  - el: ευρώ
    article: το
    ru: евро
    pos: noun
    irregular: true
    note: не склоняется
    example: Ο καφές κάνει τρία ευρώ.
    exampleRu: Кофе стоит три евро.

  - el: λεπτό ευρώ
    article: το
    ru: евроцент
    pos: noun
    irregular: true
    example: Το λεπτό ευρώ είναι το πιο μικρό κέρμα.
    exampleRu: Евроцент — самая мелкая монета.

  - el: ποσότητα
    article: η
    ru: количество
    pos: noun
    example: Η ποσότητα δεν είναι αρκετή.
    exampleRu: Количества не хватает.

  - el: κιλό
    article: το
    ru: килограмм
    pos: noun
    example: Ένα κιλό ντομάτες, παρακαλώ.
    exampleRu: Килограмм помидоров, пожалуйста.

  - el: γραμμάριο
    article: το
    ru: грамм
    pos: noun
    example: Θέλω διακόσια γραμμάρια τυρί.
    exampleRu: Мне двести граммов сыра.

  - el: κομμάτι
    article: το
    ru: кусок
    pos: noun
    example: Θέλω ένα κομμάτι τούρτα.
    exampleRu: Я хочу кусок торта.

  - el: φέτα
    article: η
    ru: ломтик (отрезанный от хлеба, сыра)
    pos: noun
    note: то же слово, что и сыр фета. Кусок вообще (торта, мяса) — το κομμάτι
    example: Κόψε μια φέτα ψωμί.
    exampleRu: Отрежь ломтик хлеба.

  - el: κουταλιά
    article: η
    ru: ложка (чего-либо)
    pos: noun
    cases:
      gen: [~, των κουταλιών]
    example: Βάλε μια κουταλιά ζάχαρη.
    exampleRu: Положи ложку сахара.

  - el: κουτί
    article: το
    ru: коробка
    pos: noun
    example: Το κουτί είναι άδειο.
    exampleRu: Коробка пустая.

  - el: μπουκάλι
    article: το
    ru: бутылка
    pos: noun
    example: Ένα μπουκάλι νερό, παρακαλώ.
    exampleRu: Бутылку воды, пожалуйста.

  - el: πακέτο
    article: το
    ru: пачка, упаковка
    pos: noun
    note: заводская упаковка товара. Пакет, в который складывают покупки, — η σακούλα
    example: Αγόρασα ένα πακέτο μακαρόνια.
    exampleRu: Я купил пачку макарон.

  - el: σακούλα
    article: η
    ru: пакет (для покупок), мешок
    pos: noun
    note: то, что дают на кассе. Пачка макарон или сигарет — το πακέτο
    cases:
      gen: [~, των σακουλών]
    example: Θέλετε σακούλα;
    exampleRu: Вам нужен пакет для покупок?

  - el: είδος
    article: το
    ru: вид, товар
    pos: noun
    example: Αυτό το είδος δεν το έχουμε.
    exampleRu: Такого товара у нас нет.

  - el: πράγμα
    article: το
    ru: вещь
    pos: noun
    example: Έχω πολλά πράγματα να κάνω.
    exampleRu: У меня много дел.

  - el: αγοράζω
    ru: покупать
    pos: verb
    example: Αγοράζω ψωμί κάθε μέρα.
    exampleRu: Я покупаю хлеб каждый день.

  - el: πουλάω
    ru: продавать
    pos: verb
    example: Πουλάω παλιά βιβλία.
    exampleRu: Я продаю старые книги.

  - el: διαλέγω
    ru: выбирать
    pos: verb
    example: Διαλέγω πάντα φρέσκα φρούτα.
    exampleRu: Я всегда выбираю свежие фрукты.

  - el: ζυγίζω
    ru: взвешивать
    pos: verb
    example: Ζυγίζω δύο κιλά ντομάτες.
    exampleRu: Я взвешиваю два килограмма помидоров.

  - el: κοστίζω
    ru: стоить
    pos: verb
    example: Πόσο κοστίζει αυτό;
    exampleRu: Сколько это стоит?

  - el: πόσο κάνει
    ru: сколько стоит?
    pos: phrase
    example: Πόσο κάνει το ψωμί;
    exampleRu: Сколько стоит хлеб?

  - el: πόσο έχει
    ru: почём?, сколько просят?
    pos: phrase
    example: Πόσο έχει το κιλό;
    exampleRu: Сколько просят за килограмм?

  - el: τα ρέστα
    ru: сдача
    pos: phrase
    example: Κρατήστε τα ρέστα.
    exampleRu: Оставьте сдачу.

  - el: τα ψιλά
    ru: мелочь
    pos: phrase
    example: Κράτα τα ψιλά για το λεωφορείο.
    exampleRu: Оставь мелочь на автобус.

  - el: τα ψώνια
    ru: покупки
    pos: phrase
    example: Έκανα τα ψώνια για την εβδομάδα.
    exampleRu: Я сделал покупки на неделю.
