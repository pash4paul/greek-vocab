topic: Одежда и обувь
lesson: "27"

words:
  - el: ρούχο
    article: το
    ru: одежда, предмет одежды
    pos: noun
    note: чаще во мн. ч. — τα ρούχα
    example: Τα ρούχα είναι στην ντουλάπα.
    exampleRu: Одежда в шкафу.

  - el: κατάστημα ρούχων
    article: το
    ru: магазин одежды
    pos: noun
    irregular: true
    note: словосочетание, склоняется только κατάστημα
    cases:
      nom: [το κατάστημα ρούχων, τα καταστήματα ρούχων]
      gen: [του καταστήματος ρούχων, των καταστημάτων ρούχων]
      acc: [το κατάστημα ρούχων, τα καταστήματα ρούχων]

  - el: δοκιμαστήριο
    article: το
    ru: примерочная
    pos: noun
    example: Πού είναι το δοκιμαστήριο;
    exampleRu: Где примерочная?

  - el: μέγεθος
    article: το
    ru: размер
    pos: noun
    irregular: true
    note: "средний род на -ος: τα μεγέθη"
    cases:
      nom: [το μέγεθος, τα μεγέθη]
      gen: [του μεγέθους, των μεγεθών]
      acc: [το μέγεθος, τα μεγέθη]
    example: Τι μέγεθος φοράτε;
    exampleRu: Какой размер вы носите?

  - el: νούμερο
    article: το
    ru: номер, размер (обуви, одежды)
    pos: noun
    example: Φοράω σαράντα δύο νούμερο.
    exampleRu: Я ношу сорок второй размер.

  - el: μπλούζα
    article: η
    ru: блузка, кофта
    pos: noun
    cases:
      gen: [~, των μπλουζών]

  - el: φανέλα
    article: η
    ru: футболка, майка
    pos: noun

  - el: φούστα
    article: η
    ru: юбка
    pos: noun
    cases:
      gen: [~, των φουστών]
    example: Η φούστα είναι πολύ κοντή.
    exampleRu: Юбка слишком короткая.

  - el: εσώρουχο
    article: το
    ru: нижнее бельё
    pos: noun
    note: чаще во мн. ч. — τα εσώρουχα

  - el: μαγιό
    article: το
    ru: купальник, плавки
    pos: noun
    irregular: true
    note: не склоняется
    cases:
      nom: [το μαγιό, τα μαγιό]
      gen: [του μαγιό, των μαγιό]
      acc: [το μαγιό, τα μαγιό]

  - el: μπουφάν
    article: το
    ru: куртка
    pos: noun
    irregular: true
    note: не склоняется
    cases:
      nom: [το μπουφάν, τα μπουφάν]
      gen: [του μπουφάν, των μπουφάν]
      acc: [το μπουφάν, τα μπουφάν]

  - el: παλτό
    article: το
    ru: пальто
    pos: noun
    irregular: true
    note: не склоняется
    cases:
      nom: [το παλτό, τα παλτό]
      gen: [του παλτό, των παλτό]
      acc: [το παλτό, τα παλτό]

  - el: παντελόνι
    article: το
    ru: брюки
    pos: noun
    note: в греческом единственное число — το παντελόνι, одни брюки
    example: Αυτό το παντελόνι είναι στενό.
    exampleRu: Эти брюки узкие.

  - el: πουκάμισο
    article: το
    ru: рубашка
    pos: noun
    example: Το πουκάμισο είναι καθαρό.
    exampleRu: Рубашка чистая.

  - el: πουλόβερ
    article: το
    ru: свитер, пуловер
    pos: noun
    irregular: true
    note: не склоняется
    cases:
      nom: [το πουλόβερ, τα πουλόβερ]
      gen: [του πουλόβερ, των πουλόβερ]
      acc: [το πουλόβερ, τα πουλόβερ]

  - el: σακάκι
    article: το
    ru: пиджак
    pos: noun

  - el: φόρεμα
    article: το
    ru: платье
    pos: noun
    example: Το φόρεμα σου πάει πολύ.
    exampleRu: Платье тебе очень идёт.

  - el: γραβάτα
    article: η
    ru: галстук
    pos: noun

  - el: ζώνη
    article: η
    ru: ремень, пояс
    pos: noun
    forms:
      plural: ζώνες

  - el: τσάντα
    article: η
    ru: сумка
    pos: noun

  - el: γάντι
    article: το
    ru: перчатка
    pos: noun
    note: "пара перчаток — ένα ζευγάρι γάντια"

  - el: καπέλο
    article: το
    ru: шляпа, кепка
    pos: noun

  - el: σακίδιο
    article: το
    ru: рюкзак
    pos: noun

  - el: κάλτσα
    article: η
    ru: носок
    pos: noun
    note: "пара носков — ένα ζευγάρι κάλτσες"

  - el: μπότα
    article: η
    ru: сапог, высокий ботинок
    pos: noun
    cases:
      gen: [~, των μποτών]

  - el: παντόφλα
    article: η
    ru: тапок, тапочка
    pos: noun
    cases:
      gen: [~, των παντοφλών]

  - el: παπούτσι
    article: το
    ru: туфля, ботинок
    pos: noun
    note: "пара обуви — ένα ζευγάρι παπούτσια"
    example: Θέλω ένα ζευγάρι παπούτσια.
    exampleRu: Мне нужна пара туфель.

  - el: αθλητικό
    article: το
    ru: кроссовок, спортивная обувь
    pos: noun
    note: полностью — αθλητικό παπούτσι; обычно во мн. ч. — τα αθλητικά

  - el: φοράω
    ru: носить (одежду), надевать
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    forms:
      aorist: φόρεσα
    note: "Αόριστος на -εσα, а не -ησα. Встречается и форма φορώ"
    example: Τι νούμερο φοράς;
    exampleRu: Какой размер ты носишь?

  - el: δοκιμάζω
    ru: примерять, пробовать
    pos: verb
    forms:
      aorist: δοκίμασα
    example: Μπορώ να δοκιμάσω αυτό το φόρεμα;
    exampleRu: Можно примерить это платье?

  - el: άνετος
    ru: удобный, просторный
    pos: adj
    example: Τα αθλητικά είναι πολύ άνετα.
    exampleRu: Кроссовки очень удобные.

  - el: στενός
    ru: узкий, тесный
    pos: adj

  - el: φαρδύς
    ru: широкий, свободный (об одежде)
    pos: adj
    irregular: true
    forms:
      gender: [φαρδύς, φαρδιά, φαρδύ]
    example: Το παντελόνι μού είναι φαρδύ.
    exampleRu: Брюки мне широки.

  - el: μου κάνει
    ru: мне подходит (по размеру)
    pos: phrase
    example: Αυτό το νούμερο δεν μου κάνει.
    exampleRu: Этот размер мне не подходит.

  - el: μου πάει
    ru: мне идёт
    pos: phrase
    note: "о цвете, фасоне: «σου πάει πολύ» — тебе очень идёт"

  - el: μου είναι
    ru: мне (велико, мало, дорого и т. п.)
    pos: phrase
    note: "в предложении ударение переходит: η φούστα μού είναι μικρή"
    example: Αυτό μου είναι ακριβό.
    exampleRu: Это мне дорого.

  - el: με γεια σου
    ru: носи на здоровье!
    pos: phrase
    note: говорят о новой вещи, обновке, стрижке; на «вы» — με γεια σας

  - el: μπλουζάκι
    article: το
    ru: блузочка, кофточка
    pos: noun
    note: уменьшительное от η μπλούζα; часто так называют и футболку
    example: Φοράω ένα άσπρο μπλουζάκι.
    exampleRu: Я ношу белую кофточку.
