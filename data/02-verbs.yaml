topic: Базовые глаголы
lesson: "03"

words:
  - el: είμαι
    ru: быть, являться
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    forms:
      present: [είμαι, είσαι, είναι, είμαστε, είστε, είναι]
      imperfect: [ήμουν, ήσουν, ήταν, ήμασταν, ήσασταν, ήταν]
    note: "неправильный; 3 л. ед. ч. и мн. ч. совпадают. Аориста нет, прошедшее одно — ήμουν"
    example: Είμαι από τη Ρωσία.
    exampleRu: Я из России.

  - el: έχω
    ru: иметь
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    forms:
      present: [έχω, έχεις, έχει, έχουμε, έχετε, έχουν]
      imperfect: είχα
      aorist: είχα
    note: "Прошедшее одно на оба вида — είχα"
    example: Έχω ένα σκύλο.
    exampleRu: У меня есть собака.

  - el: κάνω
    ru: делать
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    forms:
      present: [κάνω, κάνεις, κάνει, κάνουμε, κάνετε, κάνουν]
      aorist: έκανα
    note: "Αόριστος совпадает с παρατατικός — έκανα"
    example: Τι κάνεις;
    exampleRu: Что ты делаешь? / Как дела?

  - el: θέλω
    ru: хотеть
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    forms:
      present: [θέλω, θέλεις, θέλει, θέλουμε, θέλετε, θέλουν]
      imperfect: ήθελα
      aorist: θέλησα
    note: "Приращение ή- в παρατατικός: ήθελα, но θέλαμε"
    example: Θέλω έναν καφέ.
    exampleRu: Я хочу кофе.

  - el: ξέρω
    ru: знать
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    forms:
      present: [ξέρω, ξέρεις, ξέρει, ξέρουμε, ξέρετε, ξέρουν]
      imperfect: ήξερα
    note: "«знать» вообще: факт, ответ, дорогу. Быть знакомым с человеком — γνωρίζω. Приращение ή-: ήξερα, но ξέραμε; аориста нет"
    example: Δεν ξέρω πού είναι.
    exampleRu: Я не знаю, где это.

  - el: μιλάω
    ru: говорить, разговаривать
    pos: verb
    forms:
      present: [μιλάω, μιλάς, μιλάει, μιλάμε, μιλάτε, μιλάνε]
      aorist: μίλησα
    note: "глагол второго спряжения (на -άω), окончания отличаются от γράφω. Книжная форма — μιλώ"
    example: Μιλάς αγγλικά;
    exampleRu: Ты говоришь по-английски?

  - el: γράφω
    ru: писать
    pos: verb
    forms:
      present: [γράφω, γράφεις, γράφει, γράφουμε, γράφετε, γράφουν]
      aorist: έγραψα
    example: Γράφω ένα γράμμα.
    exampleRu: Я пишу письмо.

  - el: διαβάζω
    ru: читать
    pos: verb
    forms:
      present: [διαβάζω, διαβάζεις, διαβάζει, διαβάζουμε, διαβάζετε, διαβάζουν]
      aorist: διάβασα
    example: Διαβάζω ένα βιβλίο.
    exampleRu: Я читаю книгу.

  - el: βλέπω
    ru: видеть, смотреть
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    forms:
      present: [βλέπω, βλέπεις, βλέπει, βλέπουμε, βλέπετε, βλέπουν]
      aorist: είδα
    note: "Αόριστος от другой основы — είδα"
    example: Βλέπω τηλεόραση.
    exampleRu: Я смотрю телевизор.

  - el: πίνω
    ru: пить
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    forms:
      present: [πίνω, πίνεις, πίνει, πίνουμε, πίνετε, πίνουν]
      aorist: ήπια
    note: "Αόριστος ήπια — ή- остаётся во всех лицах"
    example: Πίνω νερό.
    exampleRu: Я пью воду.

  - el: τρώω
    ru: есть, кушать
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    note: "неправильный; спрягается короче обычных глаголов на -ω. Παρατατικός έτρωγα, αόριστος от другой основы — έφαγα"
    forms:
      present: [τρώω, τρως, τρώει, τρώμε, τρώτε, τρώνε]
      imperfect: έτρωγα
      aorist: έφαγα
    example: Τρώμε στο σπίτι.
    exampleRu: Мы едим дома.

  - el: μένω
    ru: жить, проживать, оставаться
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    forms:
      present: [μένω, μένεις, μένει, μένουμε, μένετε, μένουν]
      aorist: έμεινα
    note: "Αόριστος έμεινα: ε → ει, без -σ-"
    example: Μένω στην Αθήνα.
    exampleRu: Я живу в Афинах.

  - el: πηγαίνω
    ru: идти, ехать
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    forms:
      present: [πηγαίνω, πηγαίνεις, πηγαίνει, πηγαίνουμε, πηγαίνετε, πηγαίνουν]
      aorist: πήγα
    note: "в разговорной речи часто сокращается до πάω. Αόριστος πήγα"
    example: Πηγαίνω στη δουλειά.
    exampleRu: Я иду на работу.

  - el: καταλαβαίνω
    ru: понимать
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    forms:
      present: [καταλαβαίνω, καταλαβαίνεις, καταλαβαίνει, καταλαβαίνουμε, καταλαβαίνετε, καταλαβαίνουν]
      aorist: κατάλαβα
    note: "Αόριστος κατάλαβα — без -σ-"
    example: Δεν καταλαβαίνω.
    exampleRu: Я не понимаю.

  - el: αργώ
    ru: опаздывать
    pos: verb
    forms:
      present: [αργώ, αργείς, αργεί, αργούμε, αργείτε, αργούν]
      aorist: άργησα
    example: Αργώ πέντε λεπτά, συγγνώμη.
    exampleRu: Я опаздываю на пять минут, извините.

  - el: λείπω
    ru: отсутствовать, не быть на месте
    pos: verb
    forms:
      aorist: έλειψα
    example: Ο Γιάννης λείπει σήμερα.
    exampleRu: Янниса сегодня нет.

  - el: λέω
    ru: сказать, говорить (что-то)
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    note: "неправильный — «λες», «λέμε», «λένε», а не «λέεις», «λέουμε». В отличие от «μιλάω» (разговаривать) требует, что именно сказано. Παρατατικός έλεγα, αόριστος είπα"
    forms:
      present: [λέω, λες, λέει, λέμε, λέτε, λένε]
      imperfect: έλεγα
      aorist: είπα
    example: Λέω πάντα την αλήθεια.
    exampleRu: Я всегда говорю правду.

  # ─── Глаголы из списка по образованию аориста ───────────────────────────

  - el: αλείφω
    ru: мазать, намазывать
    pos: verb
    forms:
      aorist: άλειψα
    example: "Αλείφω βούτυρο στο ψωμί."
    exampleRu: "Я намазываю масло на хлеб."

  - el: ανάβω
    ru: зажигать, включать (свет)
    pos: verb
    forms:
      aorist: άναψα
    example: "Ανάβω το φως στην κουζίνα."
    exampleRu: "Я включаю свет на кухне."

  - el: βάφω
    ru: красить
    pos: verb
    forms:
      aorist: έβαψα
    example: "Βάφω τον τοίχο άσπρο."
    exampleRu: "Я крашу стену в белый."

  - el: ράβω
    ru: шить
    pos: verb
    forms:
      aorist: έραψα
    example: "Η γιαγιά μου ράβει ένα φόρεμα."
    exampleRu: "Моя бабушка шьёт платье."

  - el: σκάβω
    ru: копать
    pos: verb
    forms:
      aorist: έσκαψα
    example: "Ο σκύλος σκάβει στον κήπο."
    exampleRu: "Собака копает в саду."

  - el: γειτονεύω
    ru: соседствовать, жить по соседству
    pos: verb
    forms:
      aorist: γειτόνεψα
    example: "Το σπίτι μας γειτονεύει με το πάρκο."
    exampleRu: "Наш дом соседствует с парком."

  - el: λύνω
    ru: "решать; развязывать"
    pos: verb
    forms:
      aorist: έλυσα
    example: "Λύνω την άσκηση."
    exampleRu: "Я решаю упражнение."

  - el: ντύνω
    ru: одевать (кого-то)
    pos: verb
    forms:
      aorist: έντυσα
    example: "Η μαμά ντύνει το παιδί."
    exampleRu: "Мама одевает ребёнка."

  - el: ιδρύω
    ru: основывать
    pos: verb
    forms:
      imperfect: [ίδρυα, ίδρυες, ίδρυε, ιδρύαμε, ιδρύατε, ίδρυαν]
      aorist: ίδρυσα
    example: "Θέλουμε να ιδρύσουμε μια εταιρεία."
    exampleRu: "Мы хотим основать компанию."

  - el: ανοίγω
    ru: открывать
    pos: verb
    forms:
      aorist: άνοιξα
    example: "Ανοίγω το παράθυρο."
    exampleRu: "Я открываю окно."

  - el: δείχνω
    ru: показывать
    pos: verb
    forms:
      aorist: έδειξα
    example: "Σου δείχνω τον δρόμο."
    exampleRu: "Я покажу тебе дорогу."

  - el: τρέχω
    ru: бегать, бежать
    pos: verb
    forms:
      aorist: έτρεξα
    example: "Τρέχω κάθε πρωί στο πάρκο."
    exampleRu: "Я бегаю каждое утро в парке."

  - el: ρίχνω
    ru: бросать, кидать
    pos: verb
    forms:
      aorist: έριξα
    example: "Ρίχνω την μπάλα στον σκύλο."
    exampleRu: "Я бросаю мяч собаке."

  - el: σπρώχνω
    ru: толкать
    pos: verb
    forms:
      aorist: έσπρωξα
    example: "Μη με σπρώχνεις!"
    exampleRu: "Не толкай меня!"

  - el: αναπτύσσω
    ru: развивать
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    forms:
      imperfect: [ανέπτυσσα, ανέπτυσσες, ανέπτυσσε, αναπτύσσαμε, αναπτύσσατε, ανέπτυσσαν]
      aorist: [ανέπτυξα, ανέπτυξες, ανέπτυξε, αναπτύξαμε, αναπτύξατε, ανέπτυξαν]
    note: "Внутреннее приращение: ανέπτυξα, но αναπτύξαμε"
    example: "Ο τουρισμός αναπτύσσει την οικονομία."
    exampleRu: "Туризм развивает экономику."

  - el: αλλάζω
    ru: менять
    pos: verb
    forms:
      aorist: άλλαξα
    example: "Αλλάζω ρούχα πριν από το δείπνο."
    exampleRu: "Я переодеваюсь перед ужином."

  - el: κοιτάζω
    ru: смотреть (на), глядеть
    pos: verb
    forms:
      aorist: κοίταξα
    note: "Смотреть на что-то, направить взгляд. Видеть, смотреть телевизор — βλέπω"
    example: "Κοιτάζω τη θάλασσα από το μπαλκόνι."
    exampleRu: "Я смотрю на море с балкона."

  - el: προσέχω
    ru: обращать внимание, быть осторожным
    pos: verb
    forms:
      aorist: πρόσεξα
    example: "Προσέχω πάντα στον δρόμο."
    exampleRu: "Я всегда осторожен на дороге."

  - el: φτιάχνω
    ru: делать (своими руками), мастерить, чинить
    pos: verb
    forms:
      aorist: έφτιαξα
    note: "Делать что-то конкретное: еду, вещь, ремонт. Делать вообще — κάνω"
    example: "Φτιάχνω ένα κέικ για τα γενέθλια."
    exampleRu: "Я пеку торт на день рождения."

  - el: τυλίγω
    ru: заворачивать
    pos: verb
    forms:
      aorist: τύλιξα
    example: "Τυλίγω το δώρο σε χαρτί."
    exampleRu: "Я заворачиваю подарок в бумагу."

  - el: αναγνωρίζω
    ru: узнавать (кого-то), признавать
    pos: verb
    forms:
      aorist: αναγνώρισα
    example: "Δεν σε αναγνωρίζω με τα γυαλιά!"
    exampleRu: "Я тебя не узнаю в очках!"

  - el: ανεβάζω
    ru: поднимать (наверх)
    pos: verb
    forms:
      aorist: ανέβασα
    example: "Ανεβάζω τις βαλίτσες στον δεύτερο όροφο."
    exampleRu: "Я поднимаю чемоданы на второй этаж."

  - el: ελπίζω
    ru: надеяться
    pos: verb
    forms:
      aorist: έλπισα
    example: "Ελπίζω να έρθεις αύριο."
    exampleRu: "Надеюсь, ты придёшь завтра."

  - el: εξετάζω
    ru: осматривать (врачом), экзаменовать
    pos: verb
    forms:
      aorist: εξέτασα
    example: "Ο γιατρός εξετάζει τον ασθενή."
    exampleRu: "Врач осматривает пациента."

  - el: δακρύζω
    ru: слезиться, прослезиться
    pos: verb
    forms:
      aorist: δάκρυσα
    example: "Τα μάτια μου δακρύζουν από το κρεμμύδι."
    exampleRu: "У меня слезятся глаза от лука."

  - el: δανείζω
    ru: одалживать, давать взаймы
    pos: verb
    forms:
      aorist: δάνεισα
    example: "Μου δανείζεις το στυλό σου;"
    exampleRu: "Одолжишь мне свою ручку?"

  - el: λούζω
    ru: мыть (голову)
    pos: verb
    forms:
      aorist: έλουσα
    example: "Λούζω τα μαλλιά μου κάθε μέρα."
    exampleRu: "Я мою голову каждый день."

  - el: αγκαλιάζω
    ru: обнимать
    pos: verb
    forms:
      aorist: αγκάλιασα
    example: "Η μητέρα αγκαλιάζει το παιδί."
    exampleRu: "Мать обнимает ребёнка."

  - el: λογαριάζω
    ru: рассчитывать, принимать в расчёт
    pos: verb
    forms:
      aorist: λογάριασα
    example: "Λογαριάζω σε σένα."
    exampleRu: "Я рассчитываю на тебя."

  - el: πείθω
    ru: убеждать
    pos: verb
    forms:
      aorist: έπεισα
    example: "Δεν με πείθεις."
    exampleRu: "Ты меня не убедил."

  - el: σβήνω
    ru: "гасить, выключать (свет); стирать"
    pos: verb
    forms:
      aorist: έσβησα
    example: "Σβήνω το φως και κοιμάμαι."
    exampleRu: "Я выключаю свет и сплю."

  - el: ζώνω
    ru: опоясывать, окружать
    pos: verb
    forms:
      aorist: έζωσα
    example: "Η θάλασσα ζώνει το νησί."
    exampleRu: "Море окружает остров."

  - el: κλείνω
    ru: закрывать
    pos: verb
    forms:
      aorist: έκλεισα
    example: "Κλείνω την πόρτα."
    exampleRu: "Я закрываю дверь."

  - el: πιάνω
    ru: ловить, хватать (рукой)
    pos: verb
    forms:
      aorist: έπιασα
    example: "Πιάνω την μπάλα."
    exampleRu: "Я ловлю мяч."

  - el: φτάνω
    ru: "прибывать, доезжать; хватать (быть достаточно)"
    pos: verb
    forms:
      aorist: έφτασα
    example: "Το τρένο φτάνει στις οκτώ."
    exampleRu: "Поезд прибывает в восемь."

  - el: απαντώ
    ru: отвечать
    pos: verb
    forms:
      present: [απαντώ, απαντάς, απαντάει, απαντάμε, απαντάτε, απαντάνε]
      aorist: απάντησα
    example: "Γιατί δεν απαντάς στο τηλέφωνο;"
    exampleRu: "Почему ты не отвечаешь на телефон?"

  - el: βουτώ
    ru: нырять
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    forms:
      present: [βουτώ, βουτάς, βουτάει, βουτάμε, βουτάτε, βουτάνε]
      aorist: βούτηξα
    note: "Αόριστος на -ηξα, а не -ησα"
    example: "Τα παιδιά βουτάνε στη θάλασσα."
    exampleRu: "Дети ныряют в море."

  - el: γελώ
    ru: смеяться
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    forms:
      present: [γελώ, γελάς, γελάει, γελάμε, γελάτε, γελάνε]
      aorist: γέλασα
    note: "Αόριστος на -ασα, а не -ησα"
    example: "Γιατί γελάς;"
    exampleRu: "Почему ты смеёшься?"

  - el: γεννώ
    ru: рождать
    pos: verb
    forms:
      present: [γεννώ, γεννάς, γεννάει, γεννάμε, γεννάτε, γεννάνε]
      aorist: γέννησα
    example: "Η γάτα μας θα γεννήσει σύντομα."
    exampleRu: "Наша кошка скоро родит."

  - el: γλεντώ
    ru: веселиться, праздновать
    pos: verb
    forms:
      present: [γλεντώ, γλεντάς, γλεντάει, γλεντάμε, γλεντάτε, γλεντάνε]
      aorist: γλέντησα
    example: "Το Σάββατο γλεντάμε σε μια ταβέρνα."
    exampleRu: "В субботу мы празднуем в таверне."

  - el: κολλώ
    ru: клеить, приклеивать
    pos: verb
    forms:
      present: [κολλώ, κολλάς, κολλάει, κολλάμε, κολλάτε, κολλάνε]
      aorist: κόλλησα
    example: "Κολλάω τη φωτογραφία στο τετράδιο."
    exampleRu: "Я приклеиваю фотографию в тетрадь."

  - el: κρατώ
    ru: держать
    pos: verb
    forms:
      present: [κρατώ, κρατάς, κρατάει, κρατάμε, κρατάτε, κρατάνε]
      aorist: κράτησα
    example: "Κρατάω το παιδί από το χέρι."
    exampleRu: "Я держу ребёнка за руку."

  - el: κρεμώ
    ru: вешать
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    forms:
      present: [κρεμώ, κρεμάς, κρεμάει, κρεμάμε, κρεμάτε, κρεμάνε]
      aorist: κρέμασα
    note: "Αόριστος на -ασα, а не -ησα"
    example: "Κρεμάω το παλτό μου στην πόρτα."
    exampleRu: "Я вешаю пальто на дверь."

  - el: κυβερνώ
    ru: управлять, править
    pos: verb
    forms:
      present: [κυβερνώ, κυβερνάς, κυβερνάει, κυβερνάμε, κυβερνάτε, κυβερνάνε]
      aorist: κυβέρνησα
    example: "Ποιος κυβερνάει τη χώρα;"
    exampleRu: "Кто управляет страной?"

  - el: μελετώ
    ru: изучать (внимательно), заниматься
    pos: verb
    forms:
      present: [μελετώ, μελετάς, μελετάει, μελετάμε, μελετάτε, μελετάνε]
      aorist: μελέτησα
    note: "Заниматься, сидеть над учебником. Учить язык вообще — μαθαίνω"
    example: "Μελετάω για τις εξετάσεις."
