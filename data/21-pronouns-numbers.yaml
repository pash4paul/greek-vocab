topic: Местоимения и числительные
lesson: "22"

words:
  # ─── Личные местоимения ────────────────────────────────────
  - el: εγώ
    ru: я
    pos: pron

  - el: εσύ
    ru: ты
    pos: pron

  - el: αυτός
    ru: он
    pos: pron
    irregular: true
    note: αυτός — αυτή — αυτό
    forms:
      gender: [αυτός, αυτή, αυτό]

  - el: εμείς
    ru: мы
    pos: pron

  - el: εσείς
    ru: вы
    pos: pron

  - el: αυτοί
    ru: они
    pos: pron
    note: αυτοί — αυτές — αυτά

  - el: εμένα
    ru: меня
    pos: pron

  - el: εσένα
    ru: тебя
    pos: pron

  # ─── Притяжательные ────────────────────────────────────────
  - el: μου
    ru: мой
    pos: pron
    example: Το σπίτι μου είναι μικρό.
    exampleRu: Мой дом маленький.

  - el: σου
    ru: твой
    pos: pron

  - el: του
    ru: его
    pos: pron

  - el: της
    ru: её
    pos: pron

  - el: σας
    ru: ваш
    pos: pron

  # ─── Указательные и вопросительные ─────────────────────────
  - el: εκείνος
    ru: тот
    pos: pron
    note: εκείνος — εκείνη — εκείνο

  - el: ποιος
    ru: кто?, который?
    pos: pron
    irregular: true
    note: ποιος — ποια — ποιο
    forms:
      gender: [ποιος, ποια, ποιο]

  - el: πόσος
    ru: сколький?
    pos: pron

  - el: άλλος
    ru: другой
    pos: pron

  - el: κάθε
    ru: каждый
    pos: pron
    irregular: true
    note: не склоняется

  - el: κάτι
    ru: что-то
    pos: pron
    irregular: true
    note: не склоняется

  - el: τίποτα
    ru: ничего
    pos: pron
    irregular: true
    note: вариант — τίποτε; не склоняется

  - el: κανένας
    ru: какой-нибудь, никто
    pos: pron
    irregular: true
    note: κανένας — καμία — κανένα

  # ─── Числительные ──────────────────────────────────────────
  - el: πρώτος
    ru: первый
    pos: num

  - el: δεύτερος
    ru: второй
    pos: num

  - el: τρίτος
    ru: третий
    pos: num

  - el: τέταρτο
    article: το
    ru: четверть
    pos: noun

  - el: εικοστός
    ru: двадцатый
    pos: num

  # ─── Артикли ───────────────────────────────────────────────
  - el: ο, η, το
    ru: определённый артикль (м. р., ж. р., ср. р.)
    pos: other
    irregular: true
    note: единственное число именительного падежа

  - el: οι, οι, τα
    ru: определённый артикль множественного числа
    pos: other
    irregular: true
