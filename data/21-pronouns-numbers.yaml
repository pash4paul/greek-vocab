topic: Местоимения и числительные
lesson: "22"

words:
  # ─── Личные местоимения ────────────────────────────────────
  - el: εγώ
    ru: я
    pos: pron
    example: Εγώ μένω στην Αθήνα.
    exampleRu: Я живу в Афинах.

  - el: εσύ
    ru: ты
    pos: pron
    example: Εσύ τι θέλεις;
    exampleRu: А ты что хочешь?

  - el: αυτός
    ru: он
    pos: pron
    irregular: true
    note: αυτός — αυτή — αυτό
    forms:
      gender: [αυτός, αυτή, αυτό]
    example: Αυτός είναι ο αδελφός μου.
    exampleRu: Это мой брат.

  - el: εμείς
    ru: мы
    pos: pron
    example: Εμείς μιλάμε ρωσικά.
    exampleRu: Мы говорим по-русски.

  - el: εσείς
    ru: вы
    pos: pron
    example: Εσείς από πού είστε;
    exampleRu: А вы откуда?

  - el: αυτοί
    ru: они
    pos: pron
    note: αυτοί — αυτές — αυτά
    example: Αυτοί δεν είναι εδώ.
    exampleRu: Их здесь нет.

  - el: εμένα
    ru: меня
    pos: pron
    example: Εμένα δεν μου αρέσει το ψάρι.
    exampleRu: Мне рыба не нравится.

  - el: εσένα
    ru: тебя
    pos: pron

  # ─── Притяжательные ────────────────────────────────────────
    example: Αυτό είναι για εσένα.
    exampleRu: Это для тебя.
  - el: μου
    ru: мой
    pos: pron
    example: Το σπίτι μου είναι μικρό.
    exampleRu: Мой дом маленький.

  - el: σου
    ru: твой
    pos: pron
    example: Το βιβλίο σου είναι εδώ.
    exampleRu: Твоя книга здесь.

  - el: του
    ru: его
    pos: pron
    example: Το σπίτι του είναι μεγάλο.
    exampleRu: Его дом большой.

  - el: της
    ru: её
    pos: pron
    example: Η μητέρα της είναι γιατρός.
    exampleRu: Её мама врач.

  - el: σας
    ru: ваш
    pos: pron

  # ─── Указательные и вопросительные ─────────────────────────
    example: Σας ευχαριστώ πολύ.
    exampleRu: Большое вам спасибо.
  - el: εκείνος
    ru: тот
    pos: pron
    note: εκείνος — εκείνη — εκείνο
    example: Εκείνος ο δρόμος πάει στη θάλασσα.
    exampleRu: Та улица ведёт к морю.

  - el: ποιος
    ru: кто?, который?
    pos: pron
    irregular: true
    note: ποιος — ποια — ποιο
    forms:
      gender: [ποιος, ποια, ποιο]
    example: Ποιος είναι εκεί;
    exampleRu: Кто там?

  - el: πόσος
    ru: сколький?
    pos: pron
    example: Πόσοι άνθρωποι ήρθαν;
    exampleRu: Сколько человек пришло?

  - el: άλλος
    ru: другой
    pos: pron
    example: Ο άλλος δρόμος είναι πιο κοντός.
    exampleRu: Другая дорога короче.

  - el: κάθε
    ru: каждый
    pos: pron
    irregular: true
    note: не склоняется
    example: Κάθε μέρα πίνω καφέ.
    exampleRu: Каждый день я пью кофе.

  - el: κάτι
    ru: что-то
    pos: pron
    irregular: true
    note: не склоняется
    example: Θέλω κάτι κρύο.
    exampleRu: Я хочу чего-нибудь холодного.

  - el: τίποτα
    ru: ничего
    pos: pron
    irregular: true
    note: вариант — τίποτε; не склоняется
    example: Δεν θέλω τίποτα άλλο.
    exampleRu: Больше ничего не хочу.

  - el: κανένας
    ru: какой-нибудь, никто
    pos: pron
    irregular: true
    note: κανένας — καμία — κανένα

  # ─── Числительные ──────────────────────────────────────────
    example: Δεν ήρθε κανένας.
    exampleRu: Никто не пришёл.
  - el: πρώτος
    ru: первый
    pos: num
    example: Είμαι ο πρώτος στη σειρά.
    exampleRu: Я первый в очереди.

  - el: δεύτερος
    ru: второй
    pos: num
    example: Το δεύτερο μάθημα είναι πιο δύσκολο.
    exampleRu: Второй урок труднее.

  - el: τρίτος
    ru: третий
    pos: num
    example: Ήρθε τρίτος στον αγώνα.
    exampleRu: Он пришёл третьим в соревновании.

  - el: τέταρτο
    article: το
    ru: четверть
    pos: noun
    example: Είναι δέκα και τέταρτο.
    exampleRu: Сейчас четверть одиннадцатого.

  - el: εικοστός
    ru: двадцатый
    pos: num

  # ─── Артикли ───────────────────────────────────────────────
    example: Ζούμε στον εικοστό πρώτο αιώνα.
    exampleRu: Мы живём в двадцать первом веке.
  - el: ο, η, το
    ru: определённый артикль (м. р., ж. р., ср. р.)
    pos: other
    irregular: true
    note: единственное число именительного падежа
    example: Τα άρθρα στον ενικό είναι ο, η, το.
    exampleRu: Артикли единственного числа — ο, η, το.

  - el: οι, οι, τα
    ru: определённый артикль множественного числа
    pos: other
    irregular: true
    example: Στον πληθυντικό τα άρθρα είναι οι, οι, τα.
    exampleRu: Во множественном числе артикли — οι, οι, τα.
