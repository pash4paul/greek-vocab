topic: Праздники и торжества
lesson: "25"

words:
  - el: γάμος
    article: ο
    ru: свадьба
    pos: noun
    example: Ο γάμος τους είναι τον Ιούνιο.
    exampleRu: Их свадьба в июне.

  - el: γενέθλια
    article: τα
    ru: день рождения
    pos: noun
    note: только множественное число, единственного у слова нет
    cases:
      nom: [~, τα γενέθλια]
      gen: [~, των γενεθλίων]
      acc: [~, τα γενέθλια]
      voc: [~, γενέθλια]
    forms:
      plural: γενέθλια
    example: Σήμερα έχω γενέθλια.
    exampleRu: Сегодня у меня день рождения.

  - el: επέτειος
    article: η
    ru: годовщина, юбилей
    pos: noun
    note: женский род на -ος — редкий тип, склоняется «της επετείου»
    example: Γιορτάζουμε την επέτειο του γάμου μας.
    exampleRu: Мы празднуем годовщину нашей свадьбы.

  - el: πάρτι
    article: το
    ru: вечеринка
    pos: noun
    irregular: true
    note: заимствование, не склоняется — «του πάρτι», «τα πάρτι»
    cases:
      nom: [το πάρτι, τα πάρτι]
      gen: [του πάρτι, των πάρτι]
      acc: [το πάρτι, τα πάρτι]
      voc: [πάρτι, πάρτι]
    forms:
      plural: πάρτι
    example: Το πάρτι αρχίζει στις εννιά.
    exampleRu: Вечеринка начинается в девять.

  - el: πρόσκληση
    article: η
    ru: приглашение
    pos: noun
    note: "тип на -εις: οι προσκλήσεις, а не «πρόσκλησες»"
    cases:
      nom: [~, οι προσκλήσεις]
      gen: [~, των προσκλήσεων]
      acc: [~, τις προσκλήσεις]
    forms:
      plural: προσκλήσεις
    example: Έλαβα την πρόσκληση για τον γάμο.
    exampleRu: Я получил приглашение на свадьбу.

  - el: καλώ
    ru: звать, вызывать
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    note: "и «звать в гости», и «вызвать» — такси, врача, полицию. Αόριστος на -εσα, а не -ησα: κάλεσα"
    forms:
      present: [καλώ, καλείς, καλεί, καλούμε, καλείτε, καλούν]
      aorist: κάλεσα
    example: Καλώ τους φίλους μου στο σπίτι.
    exampleRu: Я зову друзей домой.

  - el: προσκαλώ
    ru: приглашать
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    note: "приглашать официально, по приглашению — сильнее, чем «καλώ». Αόριστος на -εσα, а не -ησα: προσκάλεσα"
    forms:
      present: [προσκαλώ, προσκαλείς, προσκαλεί, προσκαλούμε, προσκαλείτε, προσκαλούν]
      aorist: προσκάλεσα
    example: Σε προσκαλώ στο πάρτι μου.
    exampleRu: Я приглашаю тебя на свою вечеринку.

  - el: κάνω πάρτι
    ru: устраивать вечеринку
    pos: phrase
    example: Κάνω πάρτι για τα γενέθλιά μου.
    exampleRu: Я устраиваю вечеринку на свой день рождения.

  - el: να ζήσεις
    ru: долгих лет тебе!
    pos: phrase
    note: буквально «живи!». Нескольким или на «вы» — «να ζήσετε!». Говорят на день рождения и на свадьбе
    example: Χρόνια πολλά και να ζήσεις!
    exampleRu: С днём рождения и долгих лет!

  - el: χρόνια πολλά
    ru: с праздником!, многих лет!
    pos: phrase
    note: универсальное поздравление — и с днём рождения, и с именинами, и с Рождеством
    example: Χρόνια πολλά για τα γενέθλιά σου!
    exampleRu: С днём рождения тебя!

  - el: Χριστούγεννα
    article: τα
    ru: Рождество
    pos: noun
    note: только множественное число, единственного у слова нет
    cases:
      nom: [~, τα Χριστούγεννα]
      gen: [~, των Χριστουγέννων]
      acc: [~, τα Χριστούγεννα]
    forms:
      plural: Χριστούγεννα
    example: Τα Χριστούγεννα είμαστε όλοι μαζί.
    exampleRu: На Рождество мы все вместе.

  - el: τούρτα
    article: η
    ru: торт
    pos: noun
    cases:
      gen: [~, των τουρτών]
    example: Η τούρτα είναι σοκολατένια.
    exampleRu: Торт шоколадный.

  - el: δώρο
    article: το
    ru: подарок
    pos: noun
    example: Αυτό το δώρο είναι για σένα.
    exampleRu: Этот подарок для тебя.

  - el: κερί
    article: το
    ru: свеча
    pos: noun
    example: Η τούρτα έχει δέκα κεριά.
    exampleRu: На торте десять свечей.
