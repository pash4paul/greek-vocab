topic: Мясная лавка
lesson: "15"

words:
  - el: κρέας
    article: το
    ru: мясо
    pos: noun
    irregular: true
    note: "нерегулярное склонение: του κρέατος, τα κρέατα"
    cases:
      gen: [του κρέατος, των κρεάτων]
      nom: [~, τα κρέατα]
      acc: [~, τα κρέατα]
    forms:
      plural: κρέατα
    example: Το κρέας είναι στο ψυγείο.
    exampleRu: Мясо в холодильнике.

  - el: κοτόπουλο
    article: το
    ru: курица
    pos: noun
    example: Τρώω κοτόπουλο με ρύζι.
    exampleRu: Я ем курицу с рисом.

  - el: γαλοπούλα
    article: η
    ru: индейка
    pos: noun
    example: Η γαλοπούλα είναι για τα Χριστούγεννα.
    exampleRu: Индейка — на Рождество.

  - el: αρνί
    article: το
    ru: баранина, ягнёнок
    pos: noun
    example: Το αρνί ψήνεται στα κάρβουνα.
    exampleRu: Барашка запекают на углях.

  - el: μοσχάρι
    article: το
    ru: говядина, телёнок
    pos: noun
    example: Το μοσχάρι είναι πιο ακριβό από το χοιρινό.
