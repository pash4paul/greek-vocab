topic: Домашние дела и распорядок дня
lesson: "28"

words:
  - el: απλώνω
    ru: развешивать (бельё)
    pos: verb
    forms:
      aorist: άπλωσα
    example: Απλώνω τα ρούχα στο μπαλκόνι.
    exampleRu: Я развешиваю бельё на балконе.

  - el: βάζω πλυντήριο
    ru: запускать стиральную машину
    pos: phrase
    example: Κάθε Σάββατο βάζω πλυντήριο.
    exampleRu: Каждую субботу я запускаю стиральную машину.

  - el: καθαρίζω
    ru: чистить, убирать
    pos: verb
    forms:
      aorist: καθάρισα
    example: Καθαρίζω την κουζίνα.
    exampleRu: Я убираю кухню.

  - el: ξεσκονίζω
    ru: вытирать пыль
    pos: verb
    forms:
      aorist: ξεσκόνισα

  - el: σιδερώνω
    ru: гладить (утюгом)
    pos: verb
    forms:
      aorist: σιδέρωσα
    example: Σιδερώνω το πουκάμισο.
    exampleRu: Я глажу рубашку.

  - el: σκουπίζω
    ru: подметать, вытирать
    pos: verb
    forms:
      aorist: σκούπισα

  - el: στρώνω
    ru: стелить, накрывать
    pos: verb
    forms:
      aorist: έστρωσα
    note: "στρώνω το τραπέζι — накрываю на стол, στρώνω το κρεβάτι — застилаю кровать"
    example: Στρώνω το κρεβάτι κάθε πρωί.
    exampleRu: Я застилаю кровать каждое утро.

  - el: σφουγγαρίζω
    ru: мыть пол
    pos: verb
    forms:
      aorist: σφουγγάρισα

  - el: τακτοποιώ
    ru: наводить порядок, прибирать
    pos: verb
    forms:
      present: [τακτοποιώ, τακτοποιείς, τακτοποιεί, τακτοποιούμε, τακτοποιείτε, τακτοποιούν]
      aorist: τακτοποίησα
    example: Τακτοποιώ το δωμάτιό μου.
    exampleRu: Я прибираю свою комнату.

  - el: κάθομαι
    ru: сидеть, садиться
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    note: "среднепассивный залог. Αόριστος κάθισα — активный по форме"
    forms:
      present: [κάθομαι, κάθεσαι, κάθεται, καθόμαστε, κάθεστε, κάθονται]
      imperfect: καθόμουν
      aorist: κάθισα
    example: Κάθομαι στον καναπέ.
    exampleRu: Я сижу на диване.

  - el: λούζομαι
    ru: мыть голову (себе)
    pos: verb
    irregular: true
    note: среднепассивный залог
    forms:
      present: [λούζομαι, λούζεσαι, λούζεται, λουζόμαστε, λούζεστε, λούζονται]
      imperfect: λουζόμουν
      aorist: λούστηκα

  - el: ντύνομαι
    ru: одеваться
    pos: verb
    irregular: true
    note: среднепассивный залог
    forms:
      present: [ντύνομαι, ντύνεσαι, ντύνεται, ντυνόμαστε, ντύνεστε, ντύνονται]
      imperfect: ντυνόμουν
      aorist: ντύθηκα
    example: Ντύνομαι γρήγορα και φεύγω.
    exampleRu: Я быстро одеваюсь и ухожу.

  - el: ξυρίζομαι
    ru: бриться
    pos: verb
    irregular: true
    note: среднепассивный залог
    forms:
      present: [ξυρίζομαι, ξυρίζεσαι, ξυρίζεται, ξυριζόμαστε, ξυρίζεστε, ξυρίζονται]
      imperfect: ξυριζόμουν
      aorist: ξυρίστηκα

  - el: πάω για ύπνο
    ru: идти спать
    pos: phrase
    example: Πάω για ύπνο στις έντεκα.
    exampleRu: Я иду спать в одиннадцать.

  - el: πλένομαι
    ru: умываться, мыться
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    note: "среднепассивный залог. Αόριστος с другой основой: πλύθηκα"
    forms:
      present: [πλένομαι, πλένεσαι, πλένεται, πλενόμαστε, πλένεστε, πλένονται]
      imperfect: πλενόμουν
      aorist: πλύθηκα

  - el: πλένω
    ru: мыть, стирать
    pos: verb
    topics: [Неправильные глаголы]
    irregular: true
    note: "другая основа в аористе: έπλυνα"
    forms:
      aorist: έπλυνα
    example: Πλένω τα πιάτα μετά το φαγητό.
    exampleRu: Я мою посуду после еды.

  - el: σηκώνομαι
    ru: вставать
    pos: verb
    irregular: true
    note: среднепассивный залог
    forms:
      present: [σηκώνομαι, σηκώνεσαι, σηκώνεται, σηκωνόμαστε, σηκώνεστε, σηκώνονται]
      imperfect: σηκωνόμουν
      aorist: σηκώθηκα
    example: Σηκώνομαι νωρίς το πρωί.
    exampleRu: Я встаю рано утром.

  - el: χτενίζομαι
    ru: причёсываться
    pos: verb
    irregular: true
    note: среднепассивный залог
    forms:
      present: [χτενίζομαι, χτενίζεσαι, χτενίζεται, χτενιζόμαστε, χτενίζεστε, χτενίζονται]
      imperfect: χτενιζόμουν
      aorist: χτενίστηκα

  - el: χτενίζω
    ru: причёсывать
    pos: verb
    forms:
      aorist: χτένισα
