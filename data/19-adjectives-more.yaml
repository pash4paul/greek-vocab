topic: Прилагательные — свойства и оценки
lesson: "20"

words:
  - el: ψηλός
    ru: высокий
    pos: adj
    example: Ο αδελφός μου είναι πολύ ψηλός.
    exampleRu: Мой брат очень высокий.

  - el: όμορφος
    ru: красивый (на вид)
    pos: adj
    note: о внешности и виде. «Приятный, славный» о погоде или идее — ωραίος
    example: Τι όμορφο σπίτι!
    exampleRu: Какой красивый дом!

  - el: γνωστός
    ru: известный
    pos: adj
    example: Είναι γνωστός τραγουδιστής.
    exampleRu: Он известный певец.

  - el: άγιος
    ru: святой
    pos: adj
    example: Ο Άγιος Γεώργιος έχει γιορτή τον Απρίλιο.
    exampleRu: У святого Георгия праздник в апреле.

  - el: δημοτικός
    ru: муниципальный
    pos: adj
    example: Το δημοτικό πάρκο είναι μεγάλο.
    exampleRu: Городской парк большой.

  - el: ιδιαίτερος
    ru: особенный
    pos: adj
    example: Έχει ιδιαίτερο χρώμα.
    exampleRu: У него особенный цвет.

  - el: λίγος
    ru: немногий, малый
    pos: adj
    example: Έχω λίγο χρόνο σήμερα.
    exampleRu: У меня сегодня мало времени.

  - el: πολύς
    ru: многий
    pos: adj
    irregular: true
    note: "сильно неправильное: πολύς — πολλή — πολύ, во мн. ч. πολλοί, πολλές, πολλά"
    forms:
      gender: [πολύς, πολλή, πολύ]
    example: Έχει πολύ κόσμο στην πλατεία.
    exampleRu: На площади много народу.

  - el: μαλακός
    ru: мягкий
    pos: adj
    irregular: true
    note: женский род μαλακιά, а не «μαλακή»
    forms:
      gender: [μαλακός, μαλακιά, μαλακό]
    example: Το κρεβάτι είναι μαλακό.
    exampleRu: Кровать мягкая.

  - el: σκληρός
    ru: твёрдый, жёсткий
    pos: adj
    example: Το ψωμί είναι σκληρό.
    exampleRu: Хлеб чёрствый.

  - el: στρογγυλός
    ru: круглый
    pos: adj
    example: Το τραπέζι είναι στρογγυλό.
    exampleRu: Стол круглый.

  - el: γεμάτος
    ru: полный
    pos: adj
    example: Το ποτήρι είναι γεμάτο.
    exampleRu: Стакан полный.

  - el: άδειος
    ru: пустой
    pos: adj
    example: Ο δρόμος είναι άδειος τη νύχτα.
    exampleRu: Ночью улица пустая.

  - el: μισός
    ru: половинный
    pos: adj
    example: Θέλω μισό κιλό τυρί.
    exampleRu: Мне полкило сыра.

  - el: αλμυρός
    ru: солёный
    pos: adj
    example: Το τυρί είναι πολύ αλμυρό.
    exampleRu: Сыр очень солёный.

  - el: γλυκός
    ru: сладкий
    pos: adj
    irregular: true
    note: женский род γλυκιά
    forms:
      gender: [γλυκός, γλυκιά, γλυκό]
    example: Ο καφές είναι πολύ γλυκός.
    exampleRu: Кофе слишком сладкий.

  - el: λαϊκός
    ru: народный
    pos: adj
    example: Ακούμε λαϊκή μουσική στην ταβέρνα.
    exampleRu: В таверне мы слушаем народную музыку.

  - el: παραδοσιακός
    ru: традиционный
    pos: adj
    example: Είναι ένα παραδοσιακό φαγητό.
    exampleRu: Это традиционное блюдо.

  - el: πολιτικός
    ru: политический
    pos: adj
    example: Δεν μου αρέσει η πολιτική συζήτηση.
    exampleRu: Мне не нравятся политические разговоры.

  - el: οικονομικός
    ru: экономический, недорогой
    pos: adj
    example: Το ξενοδοχείο είναι οικονομικό.
    exampleRu: Гостиница недорогая.

  - el: αθλητικός
    ru: спортивный
    pos: adj
    example: Φοράω αθλητικά παπούτσια.
    exampleRu: Я ношу спортивную обувь.

  - el: εξαιρετικός
    ru: исключительный
    pos: adj
    example: Το φαγητό ήταν εξαιρετικό.
    exampleRu: Еда была превосходная.

  - el: χρυσός
    ru: золотой
    pos: adj
    example: Φοράει ένα χρυσό δαχτυλίδι.
    exampleRu: Она носит золотое кольцо.

  - el: αιγινήτικος
    ru: эгинский
    pos: adj
    example: Αγόρασα αιγινήτικα φυστίκια.
    exampleRu: Я купил эгинских фисташек.
