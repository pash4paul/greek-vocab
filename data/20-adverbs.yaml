topic: Наречия и место
lesson: "21"

words:
  - el: εδώ
    ru: здесь
    pos: adv
    example: Ο φίλος μου μένει εδώ.
    exampleRu: Мой друг живёт здесь.

  - el: εκεί
    ru: там
    pos: adv
    example: Το σπίτι μου είναι εκεί.
    exampleRu: Мой дом вон там.

  - el: πού
    ru: где?
    pos: adv
    example: Πού είναι το ξενοδοχείο;
    exampleRu: Где гостиница?

  - el: από πού
    ru: откуда?
    pos: adv
    example: Από πού είσαι;
    exampleRu: Откуда ты?

  - el: πώς
    ru: как?
    pos: adv
    example: Πώς σε λένε;
    exampleRu: Как тебя зовут?

  - el: πόσο
    ru: сколько?
    pos: adv
    example: Πόσο μακριά είναι η παραλία;
    exampleRu: Далеко ли до пляжа?

  - el: γιατί
    ru: почему, потому что
    pos: adv
    example: Γιατί δεν τρως;
    exampleRu: Почему ты не ешь?

  - el: κοντά
    ru: близко
    pos: adv
    example: Το μαγαζί είναι κοντά στο σπίτι.
    exampleRu: Магазин рядом с домом.

  - el: μακριά
    ru: далеко
    pos: adv
    example: Το χωριό είναι μακριά από την πόλη.
    exampleRu: Деревня далеко от города.

  - el: δίπλα
    ru: рядом
    pos: adv
    example: Κάθισε δίπλα μου.
    exampleRu: Сядь рядом со мной.

  - el: απέναντι
    ru: напротив
    pos: adv
    example: Η στάση είναι απέναντι.
    exampleRu: Остановка напротив.

  - el: ανάμεσα
    ru: между
    pos: adv
    example: Το βιβλίο είναι ανάμεσα στα τετράδια.
    exampleRu: Книга между тетрадями.

  - el: μπροστά
    ru: перед
    pos: adv
    example: Στάθηκε μπροστά στην πόρτα.
    exampleRu: Он встал перед дверью.

  - el: πίσω
    ru: за, позади
    pos: adv
    example: Ο κήπος είναι πίσω από το σπίτι.
    exampleRu: Сад позади дома.

  - el: πάνω
    ru: на, над, сверху
    pos: adv
    note: вариант — επάνω
    example: Το βιβλίο είναι πάνω στο τραπέζι.
    exampleRu: Книга на столе.

  - el: κάτω
    ru: под, внизу
    pos: adv
    example: Τα παπούτσια είναι κάτω από το κρεβάτι.
    exampleRu: Обувь под кроватью.

  - el: μέσα
    ru: внутри
    pos: adv
    example: Τα κλειδιά είναι μέσα στην τσάντα.
    exampleRu: Ключи внутри сумки.

  - el: έξω
    ru: снаружи, вне
    pos: adv
    example: Τα παιδιά παίζουν έξω.
    exampleRu: Дети играют на улице.

  - el: γύρω
    ru: вокруг
    pos: adv
    example: Γύρω από την πλατεία έχει μαγαζιά.
    exampleRu: Вокруг площади магазины.

  - el: μαζί
    ru: вместе
    pos: adv
    example: Πάμε μαζί στο σινεμά.
    exampleRu: Идём вместе в кино.

  - el: μόνο
    ru: только
    pos: adv
    example: Μιλάω μόνο λίγα ελληνικά.
    exampleRu: Я говорю только немного по-гречески.

  - el: έτσι
    ru: так
    pos: adv
    example: Έτσι είναι η ζωή.
    exampleRu: Такова жизнь.

  - el: εντάξει
    ru: в порядке, ладно
    pos: adv
    example: Εντάξει, θα έρθω.
    exampleRu: Ладно, я приду.

  - el: χάλια
    ru: плохо
    pos: adv
    example: Νιώθω χάλια σήμερα.
    exampleRu: Мне сегодня плохо.

  - el: μάλιστα
    ru: разумеется (вежливое согласие)
    pos: adv
    note: официальное «так точно» — на работе, в магазине, по телефону. Обычное «конечно» — βέβαια
    example: Μάλιστα, κυρία μου.
    exampleRu: Разумеется, госпожа.

  - el: βέβαια
    ru: конечно
    pos: adv
    note: обычное согласие. Вежливое «да, разумеется» в ответ старшему или клиенту — μάλιστα
    example: Βέβαια, μπορείς να έρθεις.
    exampleRu: Конечно, ты можешь прийти.

  - el: επίσης
    ru: также
    pos: adv
    example: Θέλω επίσης ένα ποτήρι νερό.
    exampleRu: Я хочу ещё и стакан воды.

  - el: κυρίως
    ru: в основном
    pos: adv
    example: Τρώω κυρίως λαχανικά.
    exampleRu: Я ем в основном овощи.

  - el: ακριβώς
    ru: точно
    pos: adv
    example: Είναι ακριβώς δέκα η ώρα.
    exampleRu: Ровно десять часов.

  - el: περίπου
    ru: примерно
    pos: adv
    example: Το ταξίδι θέλει περίπου δύο ώρες.
    exampleRu: Поездка занимает примерно два часа.

  - el: τουλάχιστον
    ru: по крайней мере
    pos: adv
    example: Θέλω τουλάχιστον δύο μέρες.
    exampleRu: Мне нужно минимум два дня.

  - el: αρκετά
    ru: достаточно
    pos: adv
    example: Είναι αρκετά κρύο σήμερα.
    exampleRu: Сегодня довольно холодно.

  - el: πιο
    ru: более
    pos: adv
    note: служит для образования сравнительной степени
    example: Αυτό είναι πιο ακριβό.
    exampleRu: Это дороже.

  - el: πάρα πολύ
    ru: очень сильно
    pos: adv
    example: Μου αρέσει πάρα πολύ.
    exampleRu: Мне очень сильно нравится.

  - el: τέλεια
    ru: отлично, идеально
    pos: adv
    note: о том, как что-то сделано. «Как дела? — Прекрасно» — это μια χαρά
    example: Μιλάς τέλεια ελληνικά!
    exampleRu: Ты прекрасно говоришь по-гречески!

  - el: δυστυχώς
    ru: к сожалению
    pos: adv
    example: Δυστυχώς δεν μπορώ να έρθω.
    exampleRu: К сожалению, я не могу прийти.

  - el: ευτυχώς
    ru: к счастью
    pos: adv
    example: Ευτυχώς έχει ακόμα εισιτήρια.
    exampleRu: К счастью, билеты ещё есть.

  - el: μήπως
    ru: возможно, может быть
    pos: adv
    example: Μήπως ξέρεις πού είναι η στάση;
    exampleRu: Ты не знаешь, где остановка?

  - el: πρώτα
    ru: прежде всего, сначала
    pos: adv
    example: Πρώτα τρώμε, μετά πάμε βόλτα.
    exampleRu: Сначала едим, потом идём гулять.

  - el: τσάμπα
    ru: бесплатно
    pos: adv
    example: Το εισιτήριο ήταν τσάμπα.
    exampleRu: Билет был бесплатный.

  - el: καθόλου
    ru: совсем не, вовсе
    pos: adv
    example: Δεν καταλαβαίνω καθόλου.
    exampleRu: Я совсем не понимаю.

  - el: δεν
    ru: не
    pos: adv
    note: отрицание перед глаголом
    example: Δεν θέλω τσάι.
    exampleRu: Я не хочу чая.

  - el: ωραία
    ru: прекрасно
    pos: adv

  # ─── Предлоги ──────────────────────────────────────────────
    example: Περάσαμε ωραία στην παραλία.
    exampleRu: Мы хорошо провели время на пляже.
  - el: από
    ru: из, от
    pos: prep
    example: Από το σπίτι στη δουλειά είναι δέκα λεπτά.
    exampleRu: От дома до работы десять минут.

  - el: για
    ru: для
    pos: prep
    example: Για σένα είναι αυτό το δώρο.
    exampleRu: Этот подарок для тебя.

  - el: με
    ru: с
    pos: prep
    example: Με ποιον μιλάς;
    exampleRu: С кем ты говоришь?

  - el: σε
    ru: в, на
    pos: prep
    example: Σε ποιο δωμάτιο μένεις;
    exampleRu: В какой комнате ты живёшь?

  - el: χωρίς
    ru: без
    pos: prep
    example: Ήρθα χωρίς ομπρέλα.
    exampleRu: Я пришёл без зонта.

  - el: στο
    ru: в, на (ср. р.)
    pos: prep
    note: слияние σε + το
    example: Πάω στο σχολείο.
    exampleRu: Я иду в школу.

  - el: στη
    ru: в, на (ж. р.)
    pos: prep
    note: слияние σε + τη
    example: Μένω στη Ρωσία.
    exampleRu: Я живу в России.

  - el: στον
    ru: в, на (м. р., вин. п.)
    pos: prep
    note: слияние σε + τον

  # ─── Союзы ─────────────────────────────────────────────────
    example: Πάω στον γιατρό.
    exampleRu: Я иду к врачу.
  - el: και
    ru: и
    pos: conj
    note: перед гласной часто κι
    example: Θέλω καφέ και νερό.
    exampleRu: Я хочу кофе и воду.

  - el: ή
    ru: или
    pos: conj
    example: Θέλεις τσάι ή καφέ;
    exampleRu: Хочешь чай или кофе?

  - el: αλλά
    ru: но
    pos: conj
    example: Θέλω να έρθω, αλλά δεν μπορώ.
    exampleRu: Я хочу прийти, но не могу.

  - el: όμως
    ru: однако
    pos: conj
    example: Είναι ακριβό, όμως το θέλω.
    exampleRu: Дорого, но я всё равно это хочу.

  - el: λοιπόν
    ru: итак
    pos: conj
    example: Λοιπόν, τι κάνουμε σήμερα;
    exampleRu: Итак, что делаем сегодня?

  - el: ως
    ru: до тех пор пока (союз)
    pos: conj
    note: вариант — έως
    example: Μένω εδώ ως την Κυριακή.
    exampleRu: Я остаюсь здесь до воскресенья.

  - el: πάντα
    ru: всегда
    pos: adv
    example: Πίνω πάντα καφέ το πρωί.
    exampleRu: Я всегда пью кофе утром.

  - el: κάπου
    ru: где-то
    pos: adv
    example: Το κλειδί είναι κάπου εδώ.
    exampleRu: Ключ где-то здесь.

  - el: αλήθεια
    ru: правда? неужели?
    pos: adv
    example: Αλήθεια; Δεν το ήξερα.
    exampleRu: Правда? Я этого не знал.

  - el: οικογενειακώς
    ru: всей семьёй
    pos: adv
    example: Πάμε διακοπές οικογενειακώς.
    exampleRu: Мы едем в отпуск всей семьёй.

  - el: όπως
    ru: как, так же как
    pos: adv
    example: Είναι ψηλός όπως ο πατέρας του.
    exampleRu: Он высокий, как его отец.
