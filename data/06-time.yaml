topic: Время и календарь
lesson: "07"

words:
  - el: μέρα
    article: η
    ru: день
    pos: noun
    note: полная форма — η ημέρα
    example: Τι ωραία μέρα!
    exampleRu: Какой прекрасный день!

  - el: νύχτα
    article: η
    ru: ночь
    pos: noun
    example: Η νύχτα είναι ήσυχη.
    exampleRu: Ночь тихая.

  - el: πρωί
    article: το
    ru: утро, утром
    pos: noun
    example: Το πρωί πίνω καφέ.
    exampleRu: Утром я пью кофе.

  - el: μεσημέρι
    article: το
    ru: полдень
    pos: noun
    example: Τρώμε στη μία το μεσημέρι.
    exampleRu: Мы обедаем в час дня.

  - el: απόγευμα
    article: το
    ru: послеобеденное время
    pos: noun
    example: Το απόγευμα διαβάζω ελληνικά.
    exampleRu: После обеда я занимаюсь греческим.

  - el: βράδυ
    article: το
    ru: вечер
    pos: noun
    irregular: true
    note: склоняется нерегулярно
    forms:
      plural: βράδια
    example: Το βράδυ βλέπουμε τηλεόραση.
    exampleRu: Вечером мы смотрим телевизор.

  - el: εβδομάδα
    article: η
    ru: неделя
    pos: noun
    example: Η εβδομάδα έχει επτά μέρες.
    exampleRu: В неделе семь дней.

  - el: λεπτό
    article: το
    ru: минута
    pos: noun
    example: Περίμενε ένα λεπτό.
    exampleRu: Подожди минуту.

  - el: ώρα
    article: η
    ru: час, время
    pos: noun
    cases:
      gen: [~, των ωρών]
    example: Τι ώρα είναι;
    exampleRu: Который час?

  - el: καιρός
    article: ο
    ru: время, погода
    pos: noun
    example: Δεν έχω καιρό για καφέ.
    exampleRu: У меня нет времени на кофе.

  - el: χειμώνας
    article: ο
    ru: зима
    pos: noun
    example: Τον χειμώνα κάνει κρύο.
    exampleRu: Зимой холодно.

  - el: φθινόπωρο
    article: το
    ru: осень
    pos: noun
    example: Το φθινόπωρο βρέχει συχνά.
    exampleRu: Осенью часто идёт дождь.

  - el: καλοκαίρι
    article: το
    ru: лето
    pos: noun
    example: Το καλοκαίρι πάμε στη θάλασσα.
    exampleRu: Летом мы едем на море.

  - el: Σαββατοκύριακο
    article: το
    ru: выходные, суббота и воскресенье
    pos: noun
    example: Το Σαββατοκύριακο μένω σπίτι.
    exampleRu: На выходных я остаюсь дома.

  - el: αργία
    article: η
    ru: выходной день
    pos: noun
    example: Η Δευτέρα είναι αργία.
    exampleRu: Понедельник — выходной день.

  - el: γιορτή
    article: η
    ru: праздник
    pos: noun
    example: Σήμερα έχουμε γιορτή στο σχολείο.
    exampleRu: Сегодня у нас праздник в школе.

  - el: διάλειμμα
    article: το
    ru: перерыв
    pos: noun
    example: Κάνουμε ένα μικρό διάλειμμα.
    exampleRu: Делаем небольшой перерыв.

  - el: σειρά
    article: η
    ru: очередь
    pos: noun
    cases:
      gen: [~, των σειρών]
    example: Περιμένω τη σειρά μου.
    exampleRu: Я жду своей очереди.

  - el: φορά
    article: η
    ru: раз
    pos: noun
    cases:
      gen: [~, των φορών]
    example: Είναι η πρώτη φορά που έρχομαι εδώ.
    exampleRu: Я здесь впервые.

  - el: τέλος
    article: το
    ru: конец
    pos: noun
    example: Στο τέλος του μήνα φεύγω.
    exampleRu: В конце месяца я уезжаю.

  - el: σήμερα
    ru: сегодня
    pos: adv
    example: Σήμερα δεν δουλεύω.
    exampleRu: Сегодня я не работаю.

  - el: αύριο
    ru: завтра
    pos: adv
    example: Αύριο έχω μάθημα ελληνικών.
    exampleRu: Завтра у меня урок греческого.

  - el: χτες
    ru: вчера
    pos: adv
    note: вариант написания — χθες
    example: Χτες ήμουν στη θάλασσα.
    exampleRu: Вчера я был на море.

  - el: τώρα
    ru: сейчас
    pos: adv
    example: Τώρα δεν μπορώ, συγγνώμη.
    exampleRu: Сейчас не могу, извини.

  - el: μετά
    ru: после
    pos: adv
    example: Μετά το φαγητό πίνουμε καφέ.
    exampleRu: После еды мы пьём кофе.

  - el: πάλι
    ru: снова
    pos: adv
    example: Πάλι ξέχασα το κλειδί.
    exampleRu: Я снова забыл ключ.

  - el: αργά
    ru: медленно, поздно
    pos: adv
    example: Ήρθα αργά στη δουλειά.
    exampleRu: Я поздно пришёл на работу.

  - el: αργότερα
    ru: позже
    pos: adv
    example: Θα σε πάρω τηλέφωνο αργότερα.
    exampleRu: Я позвоню тебе позже.

  - el: νωρίς
    ru: рано
    pos: adv
    example: Ξυπνάω νωρίς κάθε μέρα.
    exampleRu: Я встаю рано каждый день.

  - el: αμέσως
    ru: немедленно
    pos: adv
    example: Έλα αμέσως εδώ!
    exampleRu: Иди сюда немедленно!

  - el: ακόμα
    ru: ещё
    pos: adv
    note: вариант написания — ακόμη
    example: Δεν είμαι ακόμα έτοιμος.
    exampleRu: Я ещё не готов.

  - el: φέτος
    ru: в этом году
    pos: adv
    example: Φέτος μαθαίνω ελληνικά.
    exampleRu: В этом году я учу греческий.

  - el: συνήθως
    ru: обычно
    pos: adv
    example: Συνήθως τρώω στο σπίτι.
    exampleRu: Обычно я ем дома.

  - el: συνέχεια
    ru: постоянно
    pos: adv
    note: наречие; как существительное η συνέχεια — «продолжение»
    example: Μιλάει συνέχεια στο τηλέφωνο.
    exampleRu: Он постоянно говорит по телефону.

  - el: πότε
    ru: когда?
    pos: adv
    note: "не путать с «ποτέ» (ударение на конце) — это «никогда»: «Δεν πάω ποτέ εκεί»"
    example: Πότε έρχεσαι;
    exampleRu: Когда ты придёшь?

  - el: καθημερινός
    ru: повседневный, будний
    pos: adj
    note: η καθημερινή — ещё и «будний день». Билет или программа на один день — ημερήσιος
    example: Η καθημερινή ζωή εδώ είναι ήρεμη.
    exampleRu: Повседневная жизнь здесь спокойная.

  - el: ημερήσιος
    ru: дневной, суточный (на один день)
    pos: adj
    note: про билет, программу, норму. «Повседневный, будний» — καθημερινός
    example: Το ημερήσιο εισιτήριο κοστίζει πέντε ευρώ.
    exampleRu: Дневной билет стоит пять евро.

  - el: μέχρι
    ru: до, вплоть до (предлог)
    pos: prep
    example: Δουλεύω μέχρι τις πέντε.
    exampleRu: Я работаю до пяти.

  - el: πρωί-πρωί
    ru: рано утром
    pos: phrase
    example: Ξύπνησα πρωί-πρωί σήμερα.
    exampleRu: Сегодня я встал рано утром.

  - el: μέρα-νύχτα
    ru: днём и ночью
    pos: phrase
    example: Δουλεύει μέρα-νύχτα.
    exampleRu: Он работает днём и ночью.

  - el: μία φορά την εβδομάδα
    ru: раз в неделю
    pos: phrase
    example: Πάω στο γυμναστήριο μία φορά την εβδομάδα.
    exampleRu: Я хожу в спортзал раз в неделю.

  - el: από Δευτέρα
    ru: с понедельника
    pos: phrase
    example: Από Δευτέρα ξεκινάω δουλειά.
    exampleRu: С понедельника я начинаю работу.

  - el: μήνας
    article: ο
    ru: месяц
    pos: noun
    example: Ο Μάιος είναι ο πέμπτος μήνας.
    exampleRu: Май — пятый месяц.

  - el: χρόνος
    article: ο
    ru: год
    pos: noun
    note: "значит и «время» вообще: δεν έχω χρόνο. Два множественных: οι χρόνοι — «времена», τα χρόνια — «годы»"
    example: Μένω στην Αθήνα δύο χρόνια.
    exampleRu: Я живу в Афинах два года.

  - el: έτος
    article: το
    ru: год (в датах и документах)
    pos: noun
    example: Το έτος δύο χιλιάδες είκοσι έξι.
    exampleRu: Две тысячи двадцать шестой год.

  - el: διακοπή
    article: η
    ru: каникулы, отпуск
    pos: noun
    note: "в этом значении только во множественном числе: οι διακοπές. Единственное число значит «перерыв»"
    example: Πάμε διακοπές στην παραλία.
    exampleRu: Мы едем в отпуск на море.

  - el: άνοιξη
    article: η
    ru: весна
    pos: noun
    note: "множественное — «οι ανοίξεις», с переносом ударения; в жизни почти не встречается"
    example: Την άνοιξη ανθίζουν τα δέντρα.
    exampleRu: Весной цветут деревья.

  - el: δευτερόλεπτο
    article: το
    ru: секунда
    pos: noun
    example: Ένα λεπτό έχει εξήντα δευτερόλεπτα.
    exampleRu: В минуте шестьдесят секунд.

  - el: μεσάνυχτα
    article: τα
    ru: полночь
    pos: noun
    note: только множественное число, единственного у слова нет
    cases:
      nom: [~, τα μεσάνυχτα]
      gen: [~, των μεσανύχτων]
      acc: [~, τα μεσάνυχτα]
      voc: [~, μεσάνυχτα]
    forms:
      plural: μεσάνυχτα
    example: Το πάρτι τελείωσε μετά τα μεσάνυχτα.
    exampleRu: Вечеринка закончилась после полуночи.

  # Дни недели. Все женского рода, кроме «το Σάββατο», и всегда с большой буквы.
  - el: Δευτέρα
    article: η
    ru: понедельник
    pos: noun
    example: Τη Δευτέρα πάω στη δουλειά.
    exampleRu: В понедельник я иду на работу.

  - el: Τρίτη
    article: η
    ru: вторник
    pos: noun
    note: "множественное — «οι Τρίτες»: безударное -η правилу не подсказывает, -ες это или -εις"
    cases:
      nom: [~, οι Τρίτες]
      acc: [~, τις Τρίτες]
    forms:
      plural: Τρίτες
    example: Την Τρίτη έχω μάθημα ελληνικών.
    exampleRu: Во вторник у меня урок греческого.

  - el: Τετάρτη
    article: η
    ru: среда
    pos: noun
    note: "множественное — «οι Τετάρτες»"
    cases:
      nom: [~, οι Τετάρτες]
      acc: [~, τις Τετάρτες]
    forms:
      plural: Τετάρτες
    example: Την Τετάρτη κλείνει νωρίς το μαγαζί.
    exampleRu: В среду магазин закрывается рано.

  - el: Πέμπτη
    article: η
    ru: четверг
    pos: noun
    note: "множественное — «οι Πέμπτες»"
    cases:
      nom: [~, οι Πέμπτες]
      acc: [~, τις Πέμπτες]
    forms:
      plural: Πέμπτες
    example: Την Πέμπτη βλέπω τους φίλους μου.
    exampleRu: В четверг я вижусь с друзьями.

  - el: Παρασκευή
    article: η
    ru: пятница
    pos: noun
    example: Την Παρασκευή βγαίνουμε έξω.
    exampleRu: В пятницу мы идём гулять.

  - el: Σάββατο
    article: το
    ru: суббота
    pos: noun
    example: Το Σάββατο ξυπνάω αργά.
    exampleRu: В субботу я встаю поздно.

  - el: Κυριακή
    article: η
    ru: воскресенье
    pos: noun
    example: Την Κυριακή τρώμε όλοι μαζί.
    exampleRu: В воскресенье мы едим все вместе.

  # Месяцы. Все мужского рода и всегда с большой буквы. В датах стоит
  # родительный падеж («5 Ιανουαρίου»), и ударение в нём уходит на -ί-:
  # правило этого не выводит, потому что видит здесь синизису, — формы вписаны.
  - el: Ιανουάριος
    article: ο
    ru: январь
    pos: noun
    note: "в датах родительный: 5 Ιανουαρίου"
    cases:
      gen: [του Ιανουαρίου, των Ιανουαρίων]
      acc: [~, τους Ιανουαρίους]
    example: Ο Ιανουάριος είναι κρύος μήνας.
    exampleRu: Январь — холодный месяц.

  - el: Φεβρουάριος
    article: ο
    ru: февраль
    pos: noun
    note: "в датах родительный: 5 Φεβρουαρίου"
    cases:
      gen: [του Φεβρουαρίου, των Φεβρουαρίων]
      acc: [~, τους Φεβρουαρίους]
    example: Ο Φεβρουάριος έχει είκοσι οκτώ μέρες.
    exampleRu: В феврале двадцать восемь дней.

  - el: Μάρτιος
    article: ο
    ru: март
    pos: noun
    note: "в датах родительный: 5 Μαρτίου"
    cases:
      gen: [του Μαρτίου, των Μαρτίων]
      acc: [~, τους Μαρτίους]
    example: Τον Μάρτιο αρχίζει η άνοιξη.
    exampleRu: В марте начинается весна.

  - el: Απρίλιος
    article: ο
    ru: апрель
    pos: noun
    note: "в датах родительный: 5 Απριλίου"
    cases:
      gen: [του Απριλίου, των Απριλίων]
      acc: [~, τους Απριλίους]
    example: Τον Απρίλιο βρέχει συχνά.
    exampleRu: В апреле часто идёт дождь.

  - el: Μάιος
    article: ο
    ru: май
    pos: noun
    note: "в датах родительный: 5 Μαΐου — ударение уходит на ΐ с диерезой"
    cases:
      gen: [του Μαΐου, των Μαΐων]
      acc: [~, τους Μαΐους]
    example: Τον Μάιο έχουμε πολλές γιορτές.
    exampleRu: В мае у нас много праздников.

  - el: Ιούνιος
    article: ο
    ru: июнь
    pos: noun
    note: "в датах родительный: 5 Ιουνίου"
    cases:
      gen: [του Ιουνίου, των Ιουνίων]
      acc: [~, τους Ιουνίους]
    example: Τον Ιούνιο τελειώνει το σχολείο.
    exampleRu: В июне заканчивается школа.

  - el: Ιούλιος
    article: ο
    ru: июль
    pos: noun
    note: "в датах родительный: 5 Ιουλίου"
    cases:
      gen: [του Ιουλίου, των Ιουλίων]
      acc: [~, τους Ιουλίους]
    example: Τον Ιούλιο πάμε διακοπές.
    exampleRu: В июле мы едем в отпуск.

  - el: Αύγουστος
    article: ο
    ru: август
    pos: noun
    note: "в датах родительный: 5 Αυγούστου"
    example: Τον Αύγουστο η Αθήνα είναι άδεια.
    exampleRu: В августе Афины пустые.

  - el: Σεπτέμβριος
    article: ο
    ru: сентябрь
    pos: noun
    note: "в датах родительный: 5 Σεπτεμβρίου"
    cases:
      gen: [του Σεπτεμβρίου, των Σεπτεμβρίων]
      acc: [~, τους Σεπτεμβρίους]
    example: Τον Σεπτέμβριο αρχίζουν τα σχολεία.
    exampleRu: В сентябре начинаются занятия.

  - el: Οκτώβριος
    article: ο
    ru: октябрь
    pos: noun
    note: "в датах родительный: 5 Οκτωβρίου"
    cases:
      gen: [του Οκτωβρίου, των Οκτωβρίων]
      acc: [~, τους Οκτωβρίους]
    example: Τον Οκτώβριο έχει ωραίο καιρό.
    exampleRu: В октябре хорошая погода.

  - el: Νοέμβριος
    article: ο
    ru: ноябрь
    pos: noun
    note: "в датах родительный: 5 Νοεμβρίου"
    cases:
      gen: [του Νοεμβρίου, των Νοεμβρίων]
      acc: [~, τους Νοεμβρίους]
    example: Τον Νοέμβριο νυχτώνει γρήγορα.
    exampleRu: В ноябре быстро темнеет.

  - el: Δεκέμβριος
    article: ο
    ru: декабрь
    pos: noun
    note: "в датах родительный: 5 Δεκεμβρίου"
    cases:
      gen: [του Δεκεμβρίου, των Δεκεμβρίων]
      acc: [~, τους Δεκεμβρίους]
    example: Τον Δεκέμβριο γιορτάζουμε τα Χριστούγεννα.
    exampleRu: В декабре мы празднуем Рождество.

  - el: τι ώρα είναι
    ru: который час?
    pos: phrase
    example: Συγγνώμη, τι ώρα είναι;
    exampleRu: Извините, который час?

  - el: γύρω στη μία
    ru: около часа (о времени)
    pos: phrase
    note: так же «γύρω στις δύο» — около двух
    example: Θα έρθω γύρω στη μία.
    exampleRu: Я приду около часа.

  - el: κατά τη μία
    ru: к часу, ближе к часу
    pos: phrase
    note: так же «κατά τις δύο» — к двум
    example: Κατά τη μία τρώμε μεσημεριανό.
    exampleRu: К часу мы обедаем.

  - el: εποχή
    article: η
    ru: время года, эпоха
    pos: noun
    example: Ποια εποχή σου αρέσει;
    exampleRu: Какое время года тебе нравится?

  - el: ημερομηνία
    article: η
    ru: дата
    pos: noun
    example: Τι ημερομηνία είναι σήμερα;
    exampleRu: Какое сегодня число?

  - el: μεθαύριο
    ru: послезавтра
    pos: adv

  - el: αιώνας
    article: ο
    ru: век, столетие
    pos: noun
    example: Ζούμε στον εικοστό πρώτο αιώνα.
    exampleRu: Мы живём в двадцать первом веке.

  - el: περασμένος
    ru: прошлый, прошедший
    pos: adj
    forms:
      gender: [περασμένος, περασμένη, περασμένο]
    example: Η περασμένη χρονιά ήταν δύσκολη.
    exampleRu: Прошлый год был трудным.

  - el: πέρσι
    ru: в прошлом году
    pos: adv
    example: Πέρσι πήγαμε στην Κρήτη.
    exampleRu: В прошлом году мы ездили на Крит.

  - el: πρόπερσι
    ru: в позапрошлом году
    pos: adv
    example: Πρόπερσι έμενα στην Αθήνα.
    exampleRu: В позапрошлом году я жил в Афинах.

  - el: προχτές
    ru: позавчера
    pos: adv
    note: вариант написания — προχθές
    example: Προχτές ήμουν άρρωστος.
    exampleRu: Позавчера я болел.

  - el: το περασμένο Σάββατο
    ru: в прошлую субботу
    pos: phrase
    example: Το περασμένο Σάββατο πήγαμε σινεμά.
    exampleRu: В прошлую субботу мы ходили в кино.

  - el: την περασμένη εβδομάδα
    ru: на прошлой неделе
    pos: phrase
    example: Την περασμένη εβδομάδα δούλευα πολύ.
    exampleRu: На прошлой неделе я много работал.

  - el: τον περασμένο μήνα
    ru: в прошлом месяце
    pos: phrase
    example: Τον περασμένο μήνα πήρα το πτυχίο μου.
    exampleRu: В прошлом месяце я получил диплом.

  - el: τον περασμένο αιώνα
    ru: в прошлом веке
    pos: phrase
